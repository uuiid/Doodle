post:
  tags:
    - 子项目
  summary: 添加子项目参与人员
  description: 制片及以上权限，关联人员到子项目
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas/SubprojectPersonLink.yaml
  responses:
    '200':
      description: 关联成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SubprojectPersonLink.yaml
  security:
    - bearerAuth: []
delete:
  tags:
    - 子项目
  summary: 移除子项目参与人员
  description: 制片及以上权限，移除子项目中的参与人员
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - person_id
          properties:
            person_id:
              type: string
              format: uuid
  responses:
    '200':
      description: 移除成功
      content:
        application/json:
          schema:
            type: object
            properties:
              subproject_id:
                type: string
                format: uuid
              person_id:
                type: string
                format: uuid
  security:
    - bearerAuth: []
