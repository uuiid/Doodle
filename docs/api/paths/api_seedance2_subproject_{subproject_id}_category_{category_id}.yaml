get:
  tags:
    - AI实体类别
  summary: 获取类别详情
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: category_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: 类别详情
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AiCategory.yaml
  security:
    - bearerAuth: []
put:
  tags:
    - AI实体类别
  summary: 更新类别
  description: 制片及以上权限（非外包）可更新。可更新字段：name, description, type
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: category_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
              description: 类别名称
            description:
              type: string
              description: 类别描述
            type:
              type: string
              enum:
                - shot
                - assets
              description: 类别类型。shot - 镜头类别, assets - 素材类别
  responses:
    '200':
      description: 更新后的类别信息
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AiCategory.yaml
  security:
    - bearerAuth: []
delete:
  tags:
    - AI实体类别
  summary: 删除类别
  description: 制片及以上权限（非外包）可删除。删除时会将该类别下所有实体的 ai_category_id 置空
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: category_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '204':
      description: 删除成功
    '400':
      description: 类别不存在
  security:
    - bearerAuth: []
