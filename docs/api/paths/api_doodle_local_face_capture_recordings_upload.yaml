post:
  tags:
    - 脸捕
  summary: 上传前端录制的视频建立会话
  description: |
    前端用 `getUserMedia` + `MediaRecorder` 录完整段视频后，把视频字节流整段 POST 上来，
    服务端落盘为一个新会话目录，供后续 `POST .../{session_id}/transcode` 转码解算。

    处理器为 `local::face_capture_recording_upload::post`，实现见
    `src/doodle_lib/http_method/local/face_capture_record.cpp`：

    1. 从 `Content-Disposition` 请求头取文件名，**只看扩展名**，必须是 `.webm` 或 `.mp4`，
       否则 400「不支持的视频扩展名 <ext>，只接受 .webm 或 .mp4」；
    2. 取已落盘的请求体临时文件；不存在则 400「请求体中没有视频文件」；
       文件长度为 0 则 400「请求体中的视频文件为空: <临时路径>」；
    3. 生成新的会话 uuid，创建 `<缓存根>/face_capture/sessions/<uuid>/`；
       **没有同名目录先删的逻辑**（uuid 必然唯一）；
    4. 把临时文件按原扩展名重命名为 `take.webm` 或 `take.mp4`；
    5. 返回 `{session_id, video}`，`video` 是落盘后的文件名（`take.webm` / `take.mp4`）。

    **请求体是原始视频字节流**，不是 multipart 表单；文件名走 `Content-Disposition` 头，
    与仓库其它上传路由（`up_file_base`）一致。服务端流式落盘，不把整个视频读进内存。

    容器与编码由浏览器决定（Chrome/Edge 默认 WebM/VP8 或 VP9，Safari 多为 MP4/H.264）。
    **帧率是 MediaRecorder 的可变帧率，服务端不做恒定帧率补偿**，UE 侧统一按
    `-FPS=25/1` 解释解出的帧序列，因此长录制可能有时间轴漂移。

    该接口不占用摄像头、不需要先连接任何流；摄像头由浏览器侧独占。

    该处理器继承自 `local_http_fun`：请求头必须带非空令牌，否则 401「请先登录」；
    路由只在 `kitsu_supplement --local` 模式注册。
  operationId: face_capture_recordings_upload_post
  requestBody:
    required: true
    description: |
      原始视频字节流。`Content-Disposition` 必须是带扩展名的文件名（`take.webm` / `take.mp4`），
      `Content-Type` 建议 `video/webm` 或 `video/mp4`（内容本身不解析，只看扩展名）。
    content:
      application/octet-stream:
        schema:
          type: string
          format: binary
  responses:
    '201':
      description: 已建立会话
      content:
        application/json:
          schema:
            type: object
            required:
              - session_id
              - video
            properties:
              session_id:
                type: string
                format: uuid
                description: 新会话的 uuid，即新建会话目录的名字
              video:
                type: string
                enum:
                  - take.webm
                  - take.mp4
                description: 落盘后的视频文件名，由请求的扩展名决定
    '400':
      description: |
        扩展名不是 `.webm` / `.mp4`、请求体为空、或落盘文件长度是 0
    '401':
      description: '未提供令牌，响应体为 `{"error": "请先登录", "code": <数字码>}`'
  security:
    - bearerAuth: []
