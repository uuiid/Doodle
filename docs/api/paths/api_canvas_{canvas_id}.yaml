get:
  tags:
    - 画布
  summary: 获取画布详情
  parameters:
    - name: canvas_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: 画布详情
      content:
        application/json:
          schema:
            $ref: ../components/schemas/InfiniteCanvas.yaml
  security:
    - bearerAuth: []
put:
  tags:
    - 画布
  summary: 更新画布
  description: 可更新字段：title, description, viewport, backgroundMode
  parameters:
    - name: canvas_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            title:
              type: string
            description:
              type: string
            viewport:
              $ref: ../components/schemas/Viewport.yaml
            backgroundMode:
              $ref: ../components/schemas/CanvasBackgroundMode.yaml
  responses:
    '200':
      description: 更新后的画布信息
      content:
        application/json:
          schema:
            $ref: ../components/schemas/InfiniteCanvas.yaml
  security:
    - bearerAuth: []
delete:
  tags:
    - 画布
  summary: 删除画布
  description: 删除画布及其下所有节点和连线
  parameters:
    - name: canvas_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '204':
      description: 删除成功
  security:
    - bearerAuth: []
