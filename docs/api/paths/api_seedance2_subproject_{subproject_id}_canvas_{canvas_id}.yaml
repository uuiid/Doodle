get:
  tags:
    - 画布
  summary: 获取画布详情
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 子项目ID
    - name: canvas_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: 画布详情，含全部节点与连线
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CanvasDetail.yaml
  security:
    - bearerAuth: []
put:
  tags:
    - 画布
  summary: 更新画布
  description: 可更新字段：title, description, viewport, background_mode
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 子项目ID
    - name: canvas_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            title:
              type: string
            description:
              type: string
            viewport:
              $ref: ../components/schemas/Viewport.yaml
            background_mode:
              $ref: ../components/schemas/CanvasBackgroundMode.yaml
  responses:
    '200':
      description: 更新后的画布信息
      content:
        application/json:
          schema:
            $ref: ../components/schemas/InfiniteCanvas.yaml
  security:
    - bearerAuth: []
delete:
  tags:
    - 画布
  summary: 删除画布
  description: 删除画布及其下所有节点、连线和媒体
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 子项目ID
    - name: canvas_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '204':
      description: 删除成功
  security:
    - bearerAuth: []
