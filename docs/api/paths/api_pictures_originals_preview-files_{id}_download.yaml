get:
  tags:
    - 图片
  summary: 获取预览文件原图
  description: |
    机器生成：注册于 `kitsu.cpp`，处理器为 `pictures_originals_preview_files_download::get`，实现见 `pictures.cpp`。

    请求体与响应体的字段结构尚未逐字段整理，请以处理器实现为准。
  operationId: pictures_originals_preview_files_download_get
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: 文件内容（`Content-Type` 由文件扩展名在运行时推导，未知扩展名回退为 `application/octet-stream`）
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    '500':
      description: 原始图片不存在 文件 {}
  security:
    - bearerAuth: []
