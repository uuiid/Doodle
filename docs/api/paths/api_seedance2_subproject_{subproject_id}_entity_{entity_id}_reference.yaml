get:
  tags:
    - AI生成实体
  summary: 获取实体参考列表
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: entity_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: 参考列表
      content:
        application/json:
          schema:
            type: array
            items:
              allOf:
                - $ref: ../components/schemas/AiEntityReferencePreview.yaml
                - type: object
                  properties:
                    preview:
                      $ref: ../components/schemas/AiPreviewFile.yaml
  security:
    - bearerAuth: []
post:
  tags:
    - AI生成实体
  summary: 上传实体参考文件
  description: 非外包人员可上传。支持图片和视频（mp4/mov/avi），自动生成缩略图
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: entity_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            file:
              type: string
              format: binary
              description: 图片或视频文件
  responses:
    '200':
      description: 上传成功，返回参考记录和预览文件信息
      content:
        application/json:
          schema:
            type: object
            properties:
              reference:
                $ref: ../components/schemas/AiEntityReferencePreview.yaml
              preview:
                $ref: ../components/schemas/AiPreviewFile.yaml
  security:
    - bearerAuth: []
