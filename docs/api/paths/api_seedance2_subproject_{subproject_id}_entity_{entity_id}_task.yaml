get:
  tags:
    - 任务
  summary: 获取实体下的任务列表
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: entity_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: 任务列表
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/Task.yaml
  security:
    - bearerAuth: []
post:
  tags:
    - 任务
  summary: 创建 AI 生成任务
  description: |
    提交一个新的 AI 生成任务。会检查当前用户剩余 Token 是否充足，不足则拒绝。
    任务创建后异步运行，按所选后端扣费。

    `backend` 决定 `data_request` 的结构、下游接口与计费方式：

    | backend | 下游接口 | `data_request` 结构 | 计费 |
    | --- | --- | --- | --- |
    | `seedance2` | 火山方舟 `/api/v3/contents/generations/tasks` | `model` + `resolution` + `content[]` | 按 `completion_tokens`（默认 20 万） |
    | `transfer_station` | 中转站（Grsai）`/v1/api/generate` | `model` + `prompt` + `images[]` 等 | 按模型积分单价 |

    `seedance2` 会校验 `model` 与 `resolution` 是否在所属剧集的授权列表内，并统计生成次数上限。
    `transfer_station` 的 `replyType` 由服务端固定注入为 `async`，调用方无需传递。
    两种后端都会用 `model` + 分辨率做剧集授权校验（`transfer_station` 取 `imageSize`，没有则取 `aspectRatio`），
    缺少模型或分辨率返回 400，未授权返回 401。

    `user_id`、`ai_studio_id`、`subproject_id` 由服务端根据当前登录用户与路径参数覆盖，请求体中传值无效。
    `file_extension` 不在创建时确定，而是在任务成功、结果文件落盘后按真实文件后缀回填。
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: entity_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - data_request
            - ai_studio_id
            - project_uuid_id
            - type
            - backend
            - ai_generate_entity_id
          properties:
            data_request:
              description: AI 请求数据，结构由 `backend` 决定
              oneOf:
                - $ref: ../components/schemas/Seedance2TaskDataRequest.yaml
                - $ref: ../components/schemas/TransferStationTaskDataRequest.yaml
            backend:
              $ref: ../components/schemas/TaskBackend.yaml
            ai_studio_id:
              type: string
              format: uuid
              description: AI Studio ID（服务端会用当前用户的 Studio 覆盖）
            project_uuid_id:
              type: string
              format: uuid
            type:
              $ref: ../components/schemas/TaskType.yaml
            ai_generate_entity_id:
              type: string
              format: uuid
            archived:
              type: boolean
              default: false
  responses:
    '200':
      description: 创建成功，返回任务ID
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
  security:
    - bearerAuth: []
