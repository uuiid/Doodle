post:
  tags:
    - 画布可见人员
  summary: 批量添加画布可见人员
  description: 一次性为指定画布添加多名额外可见该画布的人员；已存在的人员自动跳过，只返回本次新增的记录
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 子项目ID
    - name: canvas_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - person_ids
          properties:
            person_ids:
              type: array
              minItems: 1
              items:
                type: string
                format: uuid
              description: 人员ID列表
  responses:
    '201':
      description: 本次新增的可见人员关联记录列表；全部已存在时为空数组
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/CanvasPersonLink.yaml
  security:
    - bearerAuth: []
