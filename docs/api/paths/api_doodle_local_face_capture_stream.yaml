get:
  tags:
    - 脸捕
  summary: WebSocket 预览推流（连接即开摄像头，纯下行）
  description: |
    该路由是 WebSocket 升级端点：`face_capture_stream::has_websocket()` 返回 `true`，
    只有 `GET` + `Upgrade: websocket` 才升级为 WS 并返回 `101 Switching Protocols`；
    普通 GET 落到基类默认实现，返回 404「服务器端未实现 api」。

    处理器为 `local::face_capture_stream`（声明见
    `src/doodle_lib/http_method/local/face_capture.h`），`websocket_callback` 只做一件事：
    构造 `face_capture::ws_outlet` 并 `start()`，别的一行不写。协议实现分布在
    `src/doodle_lib/core/face_capture/` 下：

    | 文件 | 负责 |
    | --- | --- |
    | `ws_outlet.cpp` | 连接生命周期、按 `key()` 分流的单帧在途发送、读方向空闲超时与死连接判定、关闭顺序 |
    | `ws_message.cpp` | 三种下行事件的 JSON 字段 |
    | `capture_session.cpp` | 事件发送时机、帧号、预览/录制两轴状态 |
    | `media_fragment_pipeline.cpp` | libx264 编码与 fMP4 分片切分 |

    设计依据见 `docs/face_capture_camera_stream_plan.md` §3.3 / §4.4 / §5。

    ### 连接与会话

    - 握手成功即按当前选中的摄像头 index（见 `GET/POST .../devices`）打开摄像头并推 25 fps
      预览，不写任何磁盘文件；宽高请求 1280×720（向下取偶），随后用首帧实际尺寸覆盖。
    - 每条连接各自创建并持有自己的 `capture_session`（不是全局单例），并在启动时把它登记到
      共享的 `capture_session_holder`。登记有保护（`capture_session_holder::reset`）：
      槽位里已有一个不同的会话时不覆盖，因此 holder 指向的是最早建立且尚未断开的那条连接，
      录制类接口（`/recordings*`）也作用在它上面。
    - 后连的连接不会挤掉先前的登记，也不会让服务端主动断开旧连接：它会自己再打开一次摄像头；
      打开失败（例如设备被占用）只记 WARN 日志，连接保持，但收不到 `hello`、也不会有任何帧，
      且不会收到任何错误事件。
    - 断开即结束会话：`close_impl()` 的顺序固定为「关摄像头并收尾在录的 `take.mp4` / `align.json`
      → 无条件把 holder 置空（`holder_->reset(nullptr)`，不校验归属）→ 置关闭标志 →
      正常 `async_close`」。置空不区分归属，即使槽位里此时已是另一条连接的会话也会被清掉，
      之后录制类接口会得到「当前没有可用的预览连接」。
    - `/stream` 不带路径参数，连接不携带任何会话标识；真正的录制 id 由 `POST .../recordings` 生成。
    - 服务端不解析任何上行消息（读循环每次 `async_read` 后清空缓冲区丢弃），控制面一律走 HTTP；
      服务端也不主动发 ping 或状态事件，连接是否存活由浏览器自己感知，重连就是重新发起本请求。

    ### 帧格式

    每条事件是一或两条 WebSocket 消息，按顺序配对：

    1. 先一条 text 帧，内容是 JSON 元数据（`type` 区分事件）；
    2. 若该事件带二进制负载，紧跟一条 binary 帧（H.264 / fMP4 字节）。

    text 与紧随的 binary 属于同一事件，前端按到达顺序配对即可（`avc_fragment` 的 `seq` 是帧号，
    不是消息序号）。两种帧由 `stream_.binary()` 逐次切换并在每次写完后复位。

    ### 下行事件

    | `type` | 何时发 | text 字段 | 紧随 binary |
    | --- | --- | --- | --- |
    | `hello` | 每次连接一次，在摄像头成功打开后（`capture_session::open()` 末尾） | `state`、`width`、`height`、`fps` | 无 |
    | `avc_init` | 每次连接一次，紧跟 `hello`；`POST .../recordings` 开始录制时再重发一次 | `bytes`、`seq_begin`、`seq_end` | 有：fMP4 init 段 |
    | `avc_fragment` | 每帧一次（约 40 ms）；在 `avc_init` 之后开始 | `seq`、`keyframe`、`size` | 有：分片字节 |

    字段细节：

    - `hello`：`state` 恒为 `previewing`，`fps` 恒为 25；`width` / `height` 是偶数化后的
      实际采集尺寸。`hello` 是整条连接唯一的状态快照，之后不再推任何状态事件。
    - `avc_fragment`：`seq` 取分片起始帧号（`fragment.seq_begin_`）；`size` 是紧随 binary 帧的
      字节数；`keyframe` 取分片标记，**可能为 `false`**——每帧一片（见「编码与分片参数」），
      只有帧本身就是关键帧的那一片为 `true`（每 25 帧一次），其余为 `false`。**不能**把 `keyframe` 当作
      「能否 append」的依据：分片一律是合法的 fMP4 片段，`false` 的分片照常 append，
      WebCodecs 侧按 `type: "delta"` 收即可。分片**不含** `ftyp` / `moov`，初始化段一律走 `avc_init`。
    - `avc_init`：`seq_begin` / `seq_end` 恒为 `0`；`bytes` 是 init 段字节数；binary 即
      `ftyp+moov`（`SourceBuffer.appendBuffer` 的第一块，实测 640×480 下为 716 字节 =
      `ftyp(28) + moov(688)`）。**连接建立后必然先收到一条**，前端不需要也不能自行合成；
      内容与 `POST .../recordings` 重发的那条一致（同一编码器、同一套参数），重发用于让前端
      清空缓冲重新开始。

    一期没有 `face_status`（人脸检测推迟到二期）、没有 `capture_state` 推送、也没有
    `transcode_progress` / `error` 事件：摄像头打不开只记服务端 WARN 日志；转码进度走
    `GET .../recordings/{session_id}/transcode` 与 Socket.IO（见该接口文档）。

    ### 编码与分片参数

    推流编码器与 `take.mp4` 共用同一套 libx264 参数（`configure_encoder`，
    `media_fragment_pipeline.cpp`）：

    | 项 | 取值 |
    | --- | --- |
    | 编码器 / 容器 | `libx264` → `mp4` muxer，`movflags=frag_every_frame+empty_moov+default_base_moof`，`flush_packets=1`、`mov_write_trailer=0` |
    | preset / tune / crf | `veryfast` / `zerolatency` / `23` |
    | profile / level | `main`；`level` 不显式设置，由 libx264 按分辨率自选 |
    | GOP | `keyint=25`、`min-keyint=25`、`scenecut=0`（1 秒一个关键帧） |
    | 分片粒度 | **每帧一个分片（40 ms）**，由 muxer 的 `frag_every_frame` 控制；**与 GOP 解耦**，关键帧只决定 `keyframe` 标记，不决定分片边界 |
    | B 帧 | `max_b_frames=0`（`pts == dts`，零延迟） |
    | 像素格式 | 输入 BGR24 → `yuv420p` |
    | 时基 / 帧率 | `time_base=1/25`、`frame_rate=25/1`；`pts = seq` |

    分片切分规则（`h264_fragmenter`）：libx264 每出一个包就立刻写进 fMP4 muxer
    （`flush_packets=1`），muxer 在 `frag_every_frame` 下**每写一包就产出一个完整的
    `moof+mdat`**，fragmenter 每次 `write_packet` 后立刻把 `memory_io` 里的字节作为一帧分片取出。
    **切分必须由 muxer 的 movflags 控制，不能在应用层按帧数聚合**：`frag_keyframe`（旧实现）
    只在遇到关键帧时才吐 `moof`，应用层无论怎么切都只能拿到整段 GOP（实测每片 26 帧、
    间隔 1000 ms、`keyframe` 恒为 false）。因此前端最多等一帧（约 40 ms）就能 append，
    而不是等满 1 秒。GOP 仍是 25 帧不变，唯一影响是每 25 帧有 1 个 `keyframe=true` 的分片可作重同步点。

    实测（640×480、`kitsu_supplement --local`、80 个分片）：`seq` 步长恒为 1、
    间隔平均 40.4 ms（16–78 ms）、单帧分片平均 6.6 KB、首片约 55 KB（init 段 + I 帧）、
    `keyframe=true` 每 25 帧出现一次。

    帧率口径：摄像头到达即处理（到达瞬间打 `steady_clock` 时间戳），由 `fps=25` 滤镜按真实
    时间戳采样，只有 25 fps 一个输出帧率。滤镜是采样器不是插值器，成片里的重复帧属正常现象，
    不做补位（`capture_status.inserted_frames` 恒为 0）。

    ### 帧号（`seq`）语义

    - 预览期与录制期各用一套计数：预览期是内部预览计数，录制期与 `take.mp4` 帧号一致。
    - 每次收到 `avc_init` 都表示帧号已归零：连接建立后那条是整条流的起点（前端据此初始化
      `SourceBuffer`），`POST .../recordings` 那条是录制期的起点；两种情况都应丢弃当前
      `SourceBuffer` 里的旧分片再继续 append。
    - 同一段内 `seq` 严格递增，但可能跳号（写不动时整条分片事件被丢，见下）；分片只含 1 帧，
      跳号后前端最多丢 40 ms 画面，下一个到的分片照常 append 即可继续解码，
      不需要补片逻辑（不确定时可按 `keyframe: true` 的分片做一次重同步）。
    - 停止录制不会重发 `avc_init`：`stop()` 之后帧号回到预览计数（已在 `start_record()` 时归零），
      可能与刚录完那段重叠。需要干净的时间轴就重连，或按 `avc_init` 语义自行清 buffer。

    ### 发送与丢弃

    `send()` 对调用方是同步的：把消息 `post` 到 WS 流自己的执行器，再在该执行器上
    `co_spawn` 一个 `write_message` 协程。**没有写队列，单帧在途**，按 `key()` 分两类处理：

    - **`avc_fragment`（`key() == false`）可丢**：`write_message` 入口查 `pending_frame()`，
      上一条事件还没写完就整条丢弃（text 与 binary 都不写）。
    - **`hello` / `avc_init`（`key() == true`）不丢**：不再走 `pending_frame()` 判断。它们与
      `avc_fragment` 一样投递到同一个执行器上串行执行，天然排在前一条之后，
      因此「`hello` 紧跟 `avc_init`」这类连续两次 `send()` 不会因为前一条还在写就被丢掉。
      ——早期实现对所有消息一律按 `pending_frame()` 丢弃，导致连接建立时 `avc_init` 被
      `hello` 挤掉、前端永远收不到初始化段。
    - `writing_` / `pending_since_` 覆盖**整次事件**（`avc_fragment` 的 text 帧 + binary 帧
      两次 `async_write` 合起来才算一次）：`write_message` 入口置位、两次写完才复位，
      因此 `pending_frame()` 不会在事件中途变回 `false`。
    - 采集侧（`capture_session::drain_filter_frames`）在发分片前也做了一次同样的判断：
      `l_outlet->pending_frame()` 为真就跳过该分片，不再入 `send()`。
    - 被丢的是整条事件：前端看到的只是这 40 ms 没有新画面，下一段分片照常 append 即可解码
      （分片是 GOP 内的连续片段，不需要等关键帧恢复）。

    ### 死连接判定

    - **读方向空闲超时**：连接建立后即对 WS 流设置 `stream_base::timeout`
      （`handshake_timeout` / `idle_timeout` 均为 10 s，`keep_alive_pings = true`）。
      客户端崩溃、休眠、断网等导致读侧长期无数据时，`async_read` 会在超时后返回
      `beast::error::timeout`，读循环退出，会话随即走关闭流程并**释放摄像头**。
      这一条是摄像头不被僵死连接永久占用的保证。
    - **写方向挂起判定**：新消息到达、`send()` 在流执行器上执行时检查 `stalled()`：若当前事件
      （text 与 binary 两次写）已挂起 ≥ 2000 ms（`k_stop_drain_timeout_ms`），记 INFO 日志并
      `mark_closed()`。典型场景是页面切到后台不再读 socket；摄像头没再出帧时不会有 `send()`，
      也就检测不到，这种情况由上面的读方向空闲超时兜底。
    - `write_raw` 里写失败（对端已断 / 异常）同样记 INFO 日志并 `mark_closed()`。
    - 关闭顺序固定为「读循环退出 → `close_protocol()` 发 close 帧完成握手 → `close_impl()`
      关摄像头（在录则收尾文件）、清 holder」。**协议层关闭排在资源收尾之前**，
      客户端调用 `close()` 不会因为服务端在关摄像头而等待。
    - `mark_closed()` 只置标志（`closing_ = true`、`closed_ = true`、`writing_ = false`），
      不主动关闭 TCP/WS；后续所有 `send()` 在入口短路。
    - 预览丢片不影响 `take.mp4`：两条链是独立编码器，同取滤镜输出帧，互不阻塞。
    - 摄像头静默（连续 > 1000 ms 无帧，`k_silent_timeout_ms`）只记 `gaps` 区间，不通过 WS 推送；
      要看就在 `GET .../recordings/{session_id}` 的 `gaps` 里查。

    ### 前端推荐时序

    ```
    GET(Upgrade) /stream
      <- hello                      取 width/height/fps/state
      <- avc_init                   appendBuffer(ftyp+moov)；连接后必到，不必自行合成
      <- avc_fragment seq=n key     appendBuffer(moof+mdat)   <- 持续 25 fps，每帧一片
      <- avc_fragment seq=n !key    appendBuffer 照常（非关键帧分片，可直接解码）
    POST /recordings               （显式开录；无活跃会话 -> 409）
      <- avc_init                  清 buffer，之后 seq 从 0 起
      <- avc_fragment ...          录制期分片，seq 与 take.mp4 对齐
    POST /recordings/stop          （返回时 take.mp4 已收尾，预览继续）
      <- avc_fragment ...          回到预览计数
    断开连接                       会话结束；若在录则自动收尾
    ```
  operationId: face_capture_stream
  responses:
    '101':
      description: WS 握手成功，随后按上文协议单向推流（text 元数据 + 可选紧随的 binary 帧）
    '404':
      description: '非 WebSocket 的普通 GET；响应体为 `{"error": "服务器端未实现 api", "code": <数字码>}`'
