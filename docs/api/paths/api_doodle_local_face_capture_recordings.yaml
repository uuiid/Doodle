get:
  tags:
    - 脸捕
  summary: 列出录制段
  description: |
    扫描会话根目录并返回全部录制段摘要。

    处理器为 `local::face_capture_recordings::get`，实现见
    `src/doodle_lib/http_method/local/face_capture_record.cpp`：

    - 会话根目录是 `face_capture::capture_session::default_root()`，即
      `<缓存根>/face_capture/sessions/`；
    - 只统计**含 `take.mp4` 或 `take.webm`** 的子目录，其余目录跳过；
    - 每个子目录只返回 `session_id`（取**目录名**）与 `path`（服务端磁盘路径），
      没有尺寸、帧数、时间等派生字段——`align.json` 已删除，见 `FaceCaptureRecordingSummary`；
    - 没有分页、没有过滤、没有排序保证，`count` 就是返回数组长度。

    会话目录与 WS 连接、与摄像头都解耦：前端录制 + 上传建立的会话本身就是独立目录，
    所以该接口跨连接、跨会话都能查到历史录制。

    该处理器继承自 `local_http_fun`：请求头必须带非空令牌，否则 401「请先登录」；
    路由只在 `kitsu_supplement --local` 模式注册。
  operationId: face_capture_recordings_get
  responses:
    '200':
      description: 录制段列表
      content:
        application/json:
          schema:
            $ref: ../components/schemas/FaceCaptureRecordingList.yaml
    '401':
      description: '未提供令牌，响应体为 `{"error": "请先登录", "code": <数字码>}`'
  security:
    - bearerAuth: []
post:
  tags:
    - 脸捕
  summary: 开始录制（旧版服务端实时录制，前端已不再使用）
  description: |
    > **现状**：录制已改为**前端**用 `getUserMedia` + `MediaRecorder` 完成，
    > 录完整段后走 `POST .../recordings/upload` 上传。本端点与 `POST .../recordings/stop`
    > 是旧版「后端实时录制」链路，实时推流（原 `GET .../stream`）已删除，
    > 因此**没有任何路径能再建立活动会话，这个端点在实际部署里恒返回 409**。
    > 保留它只为兼容既有调用方；新代码不要用。

    在当前 WS 会话上开始一段新录制。

    处理器为 `local::face_capture_recordings::post`，实现见
    `src/doodle_lib/http_method/local/face_capture_record.cpp`，实际状态机在
    `capture_session::start_record()`：

    1. 取共享 holder 上的活动会话；没有则 409「当前没有可用的预览连接」；
    2. `capture_session::start_record()` 要求推流轴为 `previewing`，否则 409「摄像头未打开」；
       已在录制/正在收尾则 409「已经在录制中」；
    3. 生成新的会话 uuid，创建 `<缓存根>/face_capture/sessions/<uuid>/`
       （同名目录会先被整体删除），初始化 `take.mp4`（H.264）；
       创建编码器失败则 422「无法创建 take.mp4 编码器: <路径>」；
       **不再写 `align.json`**；
    4. 录制计数器（`frames` / `raw_frames` / `duration_ms` / `truncated`）清零；
    5. 返回 `capture_status` 并补上本次的 `session_id`。

    没有请求体。

    该处理器继承自 `local_http_fun`：请求头必须带非空令牌，否则 401「请先登录」；
    该令牌不会用于录制本身（录制是纯本地动作）。
  operationId: face_capture_recordings_post
  responses:
    '201':
      description: 已开始录制
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/FaceCaptureStatus.yaml
              - type: object
                properties:
                  session_id:
                    type: string
                    format: uuid
                    description: 本次录制的会话 id，即新建会话目录的名字（`capture_session::session_dir()` 的文件名）
    '401':
      description: '未提供令牌，响应体为 `{"error": "请先登录", "code": <数字码>}`'
    '409':
      description: 没有活动预览会话、摄像头未打开、或已经在录制中
    '422':
      description: 无法创建 `take.mp4` 编码器（附带会话目录路径）
  security:
    - bearerAuth: []
