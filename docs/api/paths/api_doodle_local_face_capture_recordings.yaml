get:
  tags:
    - 脸捕
  summary: 列出录制段
  description: |
    扫描会话根目录并返回全部录制段摘要。

    处理器为 `local::face_capture_recordings::get`，实现见
    `src/doodle_lib/http_method/local/face_capture_record.cpp`：

    - 会话根目录是 `face_capture::capture_session::default_root()`，即
      `<缓存根>/face_capture/sessions/`；
    - 只统计**含 `take.mp4` 或 `align.json`** 的子目录，其余目录跳过；
    - 每个子目录的 `session_id` 取**目录名**，其余字段从该目录的 `align.json` 派生
      （`frames` 是原始帧计数，不是逐帧数组，详见 `FaceCaptureRecordingSummary`）；
    - `align.json` 读不出来时该条只返回 `session_id` 并记一条 WARN；
    - 没有分页、没有过滤、没有排序保证，`count` 就是返回数组长度。

    录制目录与 WS 连接解耦：连接断开后目录仍在，所以该接口跨连接、跨会话都能查到历史录制。

    该处理器继承自 `local_http_fun`：请求头必须带非空令牌，否则 401「请先登录」；
    路由只在 `kitsu_supplement --local` 模式注册。
  operationId: face_capture_recordings_get
  responses:
    '200':
      description: 录制段列表
      content:
        application/json:
          schema:
            $ref: ../components/schemas/FaceCaptureRecordingList.yaml
    '401':
      description: '未提供令牌，响应体为 `{"error": "请先登录", "code": <数字码>}`'
  security:
    - bearerAuth: []
post:
  tags:
    - 脸捕
  summary: 开始录制
  description: |
    在当前 WS 会话上开始一段新录制。

    处理器为 `local::face_capture_recordings::post`，实现见
    `src/doodle_lib/http_method/local/face_capture_record.cpp`，实际状态机在
    `capture_session::start_record()`：

    1. 取共享 holder 上的活动会话；没有（未连 WS、连接已断、或已被其它连接断开置空）
       则 409「当前没有可用的预览连接」；
    2. `capture_session::start_record()` 要求推流轴为 `previewing`，否则 409「摄像头未打开」；
       已在录制/正在收尾则 409「已经在录制中」；
    3. 生成新的会话 uuid，创建 `<缓存根>/face_capture/sessions/<uuid>/`
       （同名目录会先被整体删除），初始化 `take.mp4`（H.264）与 `align.json` 记录；
       创建编码器失败则 422「无法创建 take.mp4 编码器: <路径>」；
    4. 录制计数器（`frames` / `raw_frames` / `duration_ms` / `gaps` / `truncated`）清零，
       并向 WS 重发一条 `avc_init`；
    5. 返回 `capture_status` 并补上本次的 `session_id`——它是后续
       `.../recordings/{session_id}`、`.../{session_id}/stop`、`.../{session_id}/video`、
       `.../{session_id}/curves` 的路径参数。

    没有请求体。录制期间预览推流不中断；结束录制用
    `POST .../recordings/{session_id}/stop`。

    该处理器继承自 `local_http_fun`：请求头必须带非空令牌，否则 401「请先登录」；
    该令牌不会用于录制本身（录制是纯本地动作）。
  operationId: face_capture_recordings_post
  responses:
    '201':
      description: 已开始录制
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/FaceCaptureStatus.yaml
              - type: object
                properties:
                  session_id:
                    type: string
                    format: uuid
                    description: 本次录制的会话 id（`capture_session::session_id()`）
    '401':
      description: '未提供令牌，响应体为 `{"error": "请先登录", "code": <数字码>}`'
    '409':
      description: 没有活动预览会话、摄像头未打开、或已经在录制中
    '422':
      description: 无法创建 `take.mp4` 编码器（附带会话目录路径）
  security:
    - bearerAuth: []
