get:
  tags:
    - AI生成剧集
  summary: 获取剧集详情
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: episode_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: 剧集详情，附当前用户在本剧集下可见的画布列表
      content:
        application/json:
          schema:
            allOf:
              - $ref: ../components/schemas/AiEpisode.yaml
              - type: object
                properties:
                  canvas:
                    type: array
                    description: 当前用户在本剧集下可见的画布列表（自己创建的 + 通过可见人员关联表共享给自己的）
                    items:
                      $ref: ../components/schemas/InfiniteCanvas.yaml
  security:
    - bearerAuth: []
put:
  tags:
    - AI生成剧集
  summary: 更新剧集
  description: 非外包人员可更新。可更新字段：name, description, limit_count
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: episode_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
            description:
              type: string
            limit_count:
              type: integer
              format: int64
  responses:
    '200':
      description: 更新后的剧集信息
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AiEpisode.yaml
  security:
    - bearerAuth: []
delete:
  tags:
    - AI生成剧集
  summary: 删除剧集
  description: 非外包人员可删除
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: episode_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: 删除成功
      content:
        application/json:
          schema:
            type: object
            properties:
              episode_id:
                type: string
                format: uuid
  security:
    - bearerAuth: []
