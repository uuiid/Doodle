get:
  tags:
    - 画布连线
  summary: 获取画布连线列表
  description: 返回指定画布下的所有节点间连线
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 子项目ID
    - name: canvas_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: 连线列表
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/CanvasConnection.yaml
  security:
    - bearerAuth: []
post:
  tags:
    - 画布连线
  summary: 创建画布连线
  description: from_node_id 与 to_node_id 必须是同一画布下的节点
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 子项目ID
    - name: canvas_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - from_node_id
            - to_node_id
          properties:
            from_node_id:
              type: string
              format: uuid
              description: 起始节点ID
            to_node_id:
              type: string
              format: uuid
              description: 目标节点ID
  responses:
    '201':
      description: 创建成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CanvasConnection.yaml
  security:
    - bearerAuth: []
