get:
  tags:
    - 任务
  summary: 获取任务详情
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: 任务详情
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Task.yaml
  security:
    - bearerAuth: []
put:
  tags:
    - 任务
  summary: 取消任务
  description: |
    向外部服务发送取消请求，并将状态设为 cancelled。

    只有 `preparing` / `queued` 状态的任务可取消；`running` 状态仅 `backend=seedance2`
    的任务可取消（`transfer_station` 与 `apipy_image` 不支持取消在途任务）。
    `preparing` 的任务尚未提交到外部，直接置为 cancelled 并归还 token，不会发出下游请求。
    取消成功后会归还预扣的 token 并回滚生成次数。
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: 取消后的任务信息
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Task.yaml
  security:
    - bearerAuth: []
delete:
  tags:
    - 任务
  summary: 归档任务
  description: 软删除，设置 archived=true
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: 归档成功
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
  security:
    - bearerAuth: []
