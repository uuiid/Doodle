post:
  tags:
    - AI生成实体
  summary: 创建 AI 生成实体
  description: 非外包人员可创建。与剧集下创建不同，此接口的 ai_episode_id 从请求体中指定
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
            - project_uuid_id
          properties:
            name:
              type: string
            description:
              type: string
              description: 实体描述（选填）
            ai_episode_id:
              type: string
              format: uuid
              description: 所属剧集ID（选填）
            project_uuid_id:
              type: string
              format: uuid
            shot_uuid_id:
              type: string
              format: uuid
            ai_category_id:
              type: string
              format: uuid
              description: 所属实体类别ID（选填）
            preview_file:
              type: string
              format: uuid
  responses:
    '200':
      description: 创建成功
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AiGenerateEntity.yaml
  security:
    - bearerAuth: []
