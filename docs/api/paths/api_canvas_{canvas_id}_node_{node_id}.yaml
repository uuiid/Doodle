get:
  tags:
    - 画布节点
  summary: 获取画布节点详情
  parameters:
    - name: canvas_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: node_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: 节点详情
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CanvasNode.yaml
  security:
    - bearerAuth: []
put:
  tags:
    - 画布节点
  summary: 更新画布节点
  parameters:
    - name: canvas_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: node_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            type:
              $ref: ../components/schemas/CanvasNodeType.yaml
            title:
              type: string
            position:
              $ref: ../components/schemas/Position.yaml
            width:
              type: number
              format: double
            height:
              type: number
              format: double
            content:
              type: string
            metadata:
              type: object
  responses:
    '200':
      description: 更新后的节点信息
      content:
        application/json:
          schema:
            $ref: ../components/schemas/CanvasNode.yaml
  security:
    - bearerAuth: []
delete:
  tags:
    - 画布节点
  summary: 删除画布节点
  description: 删除节点及其关联的所有连线
  parameters:
    - name: canvas_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: node_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '204':
      description: 删除成功
  security:
    - bearerAuth: []
