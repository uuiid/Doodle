get:
  tags:
    - AI生成实体
  summary: 获取实体详情
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: entity_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: 实体详情
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AiGenerateEntity.yaml
  security:
    - bearerAuth: []
put:
  tags:
    - AI生成实体
  summary: 更新实体
  description: >-
    非外包人员可更新。可更新字段：name, description, preview_file, main_task_id
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: entity_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
            description:
              type: string
              description: 实体描述（选填）
            preview_file:
              type: string
              format: uuid
            main_task_id:
              type: string
              format: uuid
              description: 主要任务ID
  responses:
    '200':
      description: 更新后的实体信息
      content:
        application/json:
          schema:
            $ref: ../components/schemas/AiGenerateEntity.yaml
  security:
    - bearerAuth: []
delete:
  tags:
    - AI生成实体
  summary: 删除实体
  description: 非外包人员可删除
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: entity_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: 删除成功
      content:
        application/json:
          schema:
            type: object
            properties:
              entity_id:
                type: string
                format: uuid
  security:
    - bearerAuth: []
