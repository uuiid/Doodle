get:
  tags:
    - 脸捕
  summary: 下载录制视频
  description: |
    返回会话目录下的录制视频，**优先 `take.mp4`，不存在则回退 `take.webm`**，
    `Content-Type` 随之分别是 `video/mp4` 或 `video/webm`。

    处理器为 `local::face_capture_recording_video::get`，实现见
    `src/doodle_lib/http_method/local/face_capture_record.cpp`：
    只判断文件是否存在（两个都没有则 404「录制视频不存在」），随后以文件流返回，支持 Range。

    - 前端 `MediaRecorder` 默认产出 WebM，所以新会话通常是 `take.webm`；
      旧版服务端实时录制产出的是 `take.mp4`；
    - 该路由**不读取**共享会话，只按路径参数拼目录，因此任何历史会话都可下载；
    - 视频与 UE 链路无关（UE 只吃 PNG 序列），仅用于前端回放与人工验收。

    该处理器继承自 `local_http_fun`：请求头必须带非空令牌，否则 401「请先登录」。
  operationId: face_capture_recording_video_get
  parameters:
    - name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 录制会话 id
  responses:
    '200':
      description: 录制视频（MP4 或 WebM）
      content:
        video/mp4:
          schema:
            type: string
            format: binary
        video/webm:
          schema:
            type: string
            format: binary
    '401':
      description: '未提供令牌，响应体为 `{"error": "请先登录", "code": <数字码>}`'
    '404':
      description: 该会话目录下既没有 `take.mp4` 也没有 `take.webm`
  security:
    - bearerAuth: []
