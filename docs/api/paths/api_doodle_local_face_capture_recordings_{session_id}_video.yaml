get:
  tags:
    - 脸捕
  summary: 下载录制视频
  description: |
    以 `video/mp4` 返回会话目录下的 `take.mp4`。

    处理器为 `local::face_capture_recording_video::get`，实现见
    `src/doodle_lib/http_method/local/face_capture_record.cpp`：
    只判断文件是否存在（不存在则 404「take.mp4 不存在」），随后以文件流返回。

    - 录制**进行中**也能下载：此时 `take.mp4` 已存在但尚未收尾，
      播放器可能读不到完整时长，建议先 `POST .../{session_id}/stop`；
    - 该路由**不读取**共享会话，只按路径参数拼目录，因此断线后仍可下载历史录制；
    - `mp4` 与 UE 链路无关（UE 只吃 PNG 序列），仅用于前端回放与人工验收。

    该处理器继承自 `local_http_fun`：请求头必须带非空令牌，否则 401「请先登录」。
  operationId: face_capture_recording_video_get
  parameters:
    - name: session_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: 录制会话 id
  responses:
    '200':
      description: 录制视频
      content:
        video/mp4:
          schema:
            type: string
            format: binary
    '401':
      description: '未提供令牌，响应体为 `{"error": "请先登录", "code": <数字码>}`'
    '404':
      description: 该会话目录下没有 `take.mp4`
  security:
    - bearerAuth: []
