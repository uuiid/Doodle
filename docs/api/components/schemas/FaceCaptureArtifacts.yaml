type: object
description: |
  会话目录下已产出文件的清点结果，由 `artifacts_of()` 现场扫描磁盘得到
  （`src/doodle_lib/http_method/local/face_capture_record.cpp`）。
  目录为 `<缓存根>/face_capture/sessions/<session_id>/`。
  `align_json` 已在改造中删除（不再写逐帧对齐元数据）。
properties:
  take_mp4:
    type: boolean
    description: 是否存在 `take.mp4`（上传的 MP4，或旧版服务端实时录制的产物）
  take_webm:
    type: boolean
    description: 是否存在 `take.webm`（前端 `MediaRecorder` 录制的 WebM 上传后落盘的文件名）
  frames:
    type: integer
    format: int64
    description: 目录 `frames/` 下的 `.png` 文件个数（转码第一步产出的 PNG 序列）
  curves:
    type: boolean
    description: 是否存在 `curves/face_curves.dhfc`（UE 解算产出的动捕曲线文件，转码成功才有）
