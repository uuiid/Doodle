type: object
description: |
  服务端任务，对应 `doodle::server_task_info`。
  既是提交任务时的请求体，也是任务提交/查询接口的返回结构
  （`to_json` 的键即下列属性，`from_json` 只把 `name` 与 `source_computer` 当作必填）。
properties:
  id:
    type: string
    format: uuid
    nullable: true
    description: |
      任务唯一 id。注意：这里返回的是 `uuid_id_`（任务的 uuid），**不是**自增主键 `id_`
      —— `to_json` 中写作 `j["id"] = p.uuid_id_`。
  status:
    type: string
    description: |
      任务状态。部分提交接口会在服务端强制改写该字段（例如
      `/api/actions/projects/{project_id}/shots/{shot_id}/run-ue-assembly` 强制为
      `submitted`）；本地任务还可用 `PATCH /api/doodle/task/{id}` 修改。
    enum:
      - submitted
      - assigned
      - running
      - completed
      - canceled
      - failed
      - unknown
  name:
    type: string
    description: 任务名称；请求体中为空时服务端用任务 uuid 填充。**请求体必填**
  source_computer:
    type: string
    description: 提交任务的计算机。**请求体必填**
  submitter:
    type: string
    format: uuid
    nullable: true
    description: |
      提交人 id。主服务器接口按当前登录用户填写；本地任务接口
      （`/api/doodle/task*` 等）一律置为 nil uuid。
  submit_time:
    type: string
    nullable: true
    description: 提交时间，格式 `YYYY-MM-DDTHH:MM:SSZ`；由服务端填写
  run_time:
    type: string
    nullable: true
    description: 开始运行时间；未开始为 `null`
  end_time:
    type: string
    nullable: true
    description: 结束运行时间；未结束为 `null`
  run_computer_id:
    type: string
    format: uuid
    nullable: true
    description: 分配到的计算机 id；未分配为 `null`
  type:
    type: string
    description: |
      任务类型。部分提交接口会在服务端强制改写该字段（例如 UE 装配接口强制为
      `auto_light`、`/api/doodle/task/{id}/inspect` 强制为 `check_maya`）。

      ⚠️ JSON 序列化表（`server_task_info_type.h`）只登记了下列取值，
      **不含** `create_rig_sk` 与 `project_sync`；按 nlohmann 的缺省规则，
      这两个取值在 JSON 中会落回第一项 `export_fbx`（服务端内部仍按正确类型执行），
      因此调用 `/api/doodle/task/{id}/generate_uesk_file`、
      `/api/actions/project/{project_id}/sync` 等接口时，
      返回体里的 `type` 会显示为 `export_fbx`。
    enum:
      - export_fbx
      - export_sim
      - auto_light
      - merge_video
      - connect_video
      - check_maya
      - replace_maya_ref
      - depth_estimation
      - ai_light
  last_line_log:
    type: string
    description: 最后一行日志
  run_time_info:
    type: object
    description: 运行时段信息（数组或对象，视服务端写入而定）
  command:
    type: object
    description: |
      任务参数。各提交接口写入各自的参数结构（例如 `RunUeAssemblyArg`、
      `export_fbx_arg`、`qcloth_arg`、`task_sync` 等）；
      `POST /api/doodle/task` 则取请求体的 `task_data` 字段。
  priority:
    type: integer
    format: int32
    description: 优先级，默认 100
  task_id:
    type: string
    format: uuid
    nullable: true
    description: 关联的业务任务（镜头任务）id，由服务端按 URL 路径参数填写
  submitter_cookies:
    type: string
    description: 提交者的 cookies
required:
  - name
  - source_computer
