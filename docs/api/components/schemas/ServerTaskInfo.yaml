type: object
description: |
  服务端任务，对应 `doodle::server_task_info`。
  既是提交任务时的请求体，也是任务提交/查询接口的返回结构
  （`to_json` 的键即下列属性，`from_json` 只把 `name` 与 `source_computer` 当作必填）。
properties:
  id:
    type: string
    format: uuid
    nullable: true
    description: |
      任务唯一 id。注意：这里返回的是 `uuid_id_`（任务的 uuid），**不是**自增主键 `id_`
      —— `to_json` 中写作 `j["id"] = p.uuid_id_`。
  status:
    type: string
    description: |
      任务状态。部分提交接口会在服务端强制改写该字段（例如
      `/api/actions/projects/{project_id}/shots/{shot_id}/run-ue-assembly` 强制为
      `submitted`）；本地任务还可用 `PATCH /api/doodle/task/{id}` 修改。
    enum:
      - submitted
      - assigned
      - running
      - completed
      - canceled
      - failed
      - unknown
  name:
    type: string
    description: 任务名称；请求体中为空时服务端用任务 uuid 填充。**请求体必填**
  source_computer:
    type: string
    description: 提交任务的计算机。**请求体必填**
  submitter:
    type: string
    format: uuid
    nullable: true
    description: |
      提交人 id。主服务器接口按当前登录用户填写；本地任务接口
      （`/api/doodle/task*` 等）一律置为 nil uuid。
  submit_time:
    type: string
    nullable: true
    description: 提交时间，格式 `YYYY-MM-DDTHH:MM:SSZ`；由服务端填写
  run_time:
    type: string
    nullable: true
    description: 开始运行时间；未开始为 `null`
  end_time:
    type: string
    nullable: true
    description: 结束运行时间；未结束为 `null`
  run_computer_id:
    type: string
    format: uuid
    nullable: true
    description: 分配到的计算机 id；未分配为 `null`
  type:
    type: string
    description: |
      任务类型，取值**必须**是下列枚举之一（C++ 侧 `doodle::server_task_info_type`）。

      ⚠️ **传入枚举以外的字符串会导致请求失败。** 该枚举用
      `DOODLE_JSON_SERIALIZE_ENUM_STRICT`（`server_task_info_type.h`）序列化：
      反序列化遇到未登记的值会抛 `out_of_range.410`，异常一路冒到
      `http_session_data.cpp` 的兜底 `catch (...)`，最终以 **500** 返回，
      且响应体是 `current_exception_diagnostic_information()` 的完整诊断串
      （带内部文件路径与调用栈），**不是**可读的字段错误提示。
      （切勿按 nlohmann `NLOHMANN_JSON_SERIALIZE_ENUM` 的旧行为理解 —— 那时会静默
      落到首项 `export_fbx`；本仓库所有枚举已在 d658c4a40 迁移到 strict 版本。）

      部分提交接口会在服务端**强制改写**该字段（例如 UE 装配接口强制为
      `auto_light`、`/api/doodle/task/{id}/inspect` 强制为 `check_maya`）；
      被强制改写的接口不再读取请求体里的 `type`。

      **枚举值与 JSON 字符串的映射不完整**：C++ 枚举共有 12 项，但上表只登记了
      9 项字符串映射。`unknown`（`-1`）、`create_rig_sk`、`project_sync`
      **没有任何 JSON 字符串形式** —— 它们在 `to_json` 与 `from_json` 两个方向
      都会抛 `out_of_range.410`：

      | C++ 枚举值 | JSON 字符串 | 说明 |
      | --- | --- | --- |
      | `unknown`（`-1`） | ❌ 无 | 仅用于查询过滤，不可作为字段值传递 |
      | `export_fbx`（`0`） | `export_fbx` | |
      | `export_sim` | `export_sim` | |
      | `auto_light` | `auto_light` | |
      | `merge_video` | `merge_video` | |
      | `connect_video` | `connect_video` | |
      | `check_maya` | `check_maya` | |
      | `replace_maya_ref` | `replace_maya_ref` | |
      | `create_rig_sk` | ❌ 无 | 服务端内部使用；提交接口丢弃请求体的 `type` |
      | `project_sync` | ❌ 无 | 服务端内部使用；提交接口丢弃请求体的 `type` |
      | `depth_estimation` | `depth_estimation` | |
      | `ai_light` | `ai_light` | |

      因此：**响应体里的 `type` 只会出现上表 9 个已登记取值**。
      涉及 `create_rig_sk` / `project_sync` 的接口
      （`/api/doodle/task/{id}/generate_uesk_file`、
      `/api/actions/project/{project_id}/sync`、
      `/api/actions/local/task/{id}/update/movie*`、`.../update/ue`）
      在**序列化响应时同样会抛异常**，无法返回 `server_task_info` 的 JSON。
    enum:
      - export_fbx
      - export_sim
      - auto_light
      - merge_video
      - connect_video
      - check_maya
      - replace_maya_ref
      - depth_estimation
      - ai_light
  last_line_log:
    type: string
    description: 最后一行日志
  run_time_info:
    type: object
    description: 运行时段信息（数组或对象，视服务端写入而定）
  command:
    type: object
    description: |
      任务参数。各提交接口写入各自的参数结构（例如 `RunUeAssemblyArg`、
      `export_fbx_arg`、`qcloth_arg`、`task_sync` 等）；
      `POST /api/doodle/task` 则取请求体的 `task_data` 字段。
  priority:
    type: integer
    format: int32
    description: 优先级，默认 100
  task_id:
    type: string
    format: uuid
    nullable: true
    description: 关联的业务任务（镜头任务）id，由服务端按 URL 路径参数填写
  submitter_cookies:
    type: string
    description: 提交者的 cookies
required:
  - name
  - source_computer
