type: string
description: |
  脸捕会话状态（历史字段）。

  > **现状**：实时录制链路（`capture_session` 的状态机、`/devices`、`POST /recordings`、
  > `POST /recordings/stop`）已全部删除，服务端不再产生 `idle` / `previewing` / `recording` /
  > `stopping` 任何一个取值。`GET .../recordings/{session_id}` 里的 `state` 恒为 `stopped`。

  | 取值 | 含义 |
  | --- | --- |
  | `idle` | 历史值，不再产生 |
  | `previewing` | 历史值，不再产生 |
  | `recording` | 历史值，不再产生 |
  | `stopping` | 历史值，不再产生 |
  | `stopped` | 当前唯一会返回的取值 |
enum:
  - idle
  - recording
  - stopping
  - stopped
  - previewing
