type: object
description: |
  `GET /api/doodle/local/face_capture/recordings/{session_id}` 的响应：
  会话摘要 + 实时状态 + 磁盘产出清点。

  - `session_id` 固定为 URL 里的路径参数（实现会覆盖同名字段）；
  - `state` 是该会话的实时状态：`session_id` 正是当前活动会话时取
    `capture_session::state()`；否则固定为 `stopped`（该会话已无活动连接）。
    注意前端录制 + 上传这条路径**不会**建立 `capture_session`，所以上传出来的会话恒为 `stopped`。
allOf:
  - $ref: ./FaceCaptureRecordingSummary.yaml
  - type: object
    properties:
      state:
        $ref: ./FaceCaptureState.yaml
      artifacts:
        $ref: ./FaceCaptureArtifacts.yaml
