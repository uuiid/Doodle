type: object
description: |
  `GET /api/doodle/local/face_capture/recordings/{session_id}` 的响应：
  会话摘要 + 实时状态 + 磁盘产出清点。

  - `session_id` 固定为 URL 里的路径参数（实现会覆盖同名字段）；
  - `state` 恒为 `stopped`：会话目录一旦由上传接口建立就是终态，
    实时录制链路（`capture_session`）已随 `/devices`、`POST /recordings`、`/recordings/stop`
    一起删除，不再存在「正在录制」的会话。字段保留只为兼容既有的响应形状。
allOf:
  - $ref: ./FaceCaptureRecordingSummary.yaml
  - type: object
    properties:
      state:
        $ref: ./FaceCaptureState.yaml
      artifacts:
        $ref: ./FaceCaptureArtifacts.yaml
