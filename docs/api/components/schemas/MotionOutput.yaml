type: object
description: Kimodo 运动解码输出，T 为帧数、J 为关节数
properties:
  local_rot_mats:
    type: array
    description: 局部旋转矩阵 [T, J, 3, 3]
    items:
      type: array
      items:
        type: array
        items:
          type: number
  global_rot_mats:
    type: array
    description: 全局旋转矩阵 [T, J, 3, 3]
    items:
      type: array
      items:
        type: array
        items:
          type: number
  root_positions:
    type: array
    description: 根节点位置 [T, 3]
    items:
      type: array
      items:
        type: number
  smooth_root_pos:
    type: array
    description: 平滑根位置 [T, 3]
    items:
      type: array
      items:
        type: number
  global_root_heading:
    type: array
    description: 全局根朝向 [T, 2]，每帧 [cos, sin]
    items:
      type: array
      items:
        type: number
