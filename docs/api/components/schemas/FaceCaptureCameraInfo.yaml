type: object
description: |
  摄像头信息，对应 `doodle::face_capture::camera_info`（`face_capture_types.h`）；
  由 `capture_session::list_devices()` 用 **Media Foundation 原生 API** 枚举得到。

  探测规则（`src/doodle_lib/core/face_capture/capture_session.cpp` 的 `list_devices()`）：
  `MFEnumDeviceSources` 枚举视频源，逐个 `IMFActivate::ActivateObject` 打开
  `IMFMediaSource`，遍历 presentation descriptor 里所有流的 media type，
  取**面积最大**的帧尺寸。
properties:
  index:
    type: integer
    format: int32
    description: 摄像头序号，从 0 开始；即 `POST .../devices` 请求体里的 `index`
  name:
    type: string
    description: 设备名。当前实现是合成的 `camera_<index>`，不是系统设备描述
  backend:
    type: string
    description: 固定为 `MSMF`（枚举走 Media Foundation；值由实现直接写入，不来自运行时查询）
  width:
    type: integer
    format: int32
    description: |
      该摄像头 media type 里面积最大的宽度；读不到 media type 时为 0。
      注意这不代表 `POST /face_capture/recordings` 实际会以该尺寸打开
      （旧版采集路径会把它截断到 1920×1080）。
  height:
    type: integer
    format: int32
    description: 同上，最大高度；读不到时为 0
