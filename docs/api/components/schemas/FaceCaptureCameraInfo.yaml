type: object
description: |
  摄像头信息，对应 `doodle::face_capture::camera_info`（`face_capture_types.h`）；
  由 `capture_session::list_devices()` 逐个打开 index 探测得到。

  探测规则（`src/doodle_lib/core/face_capture/capture_session.cpp` 的 `list_devices()`）：
  index 从 0 到 7 依次尝试，先 `cv::CAP_DSHOW`、失败再回退 `cv::CAP_MSMF`，
  **遇到第一个打不开的 index 立即停止**，因此编号不连续时后面的设备不会被枚举到。
properties:
  index:
    type: integer
    format: int32
    description: 摄像头序号，从 0 开始；即 `POST .../devices` 请求体里的 `index`
  name:
    type: string
    description: 设备名。当前实现是合成的 `camera_<index>`，不是系统设备描述
  backend:
    type: string
    description: 实际打开成功的 OpenCV 后端名（如 `DSHOW` / `MSMF`），取自 `cv::VideoCapture::getBackendName()`
  width:
    type: integer
    format: int32
    description: 摄像头默认采集宽度（`cv::CAP_PROP_FRAME_WIDTH`）
  height:
    type: integer
    format: int32
    description: 摄像头默认采集高度（`cv::CAP_PROP_FRAME_HEIGHT`）
