type: object
description: |
  录制段摘要（录像列表项），由 `recording_json()` 生成
  （见 `src/doodle_lib/http_method/local/face_capture_record.cpp`）。

  改造后（前端录制 + 上传）只有两个字段：服务端不再写 `align.json`，
  因此早期版本里的 `width` / `height` / `fps` / `source_fps` / `started_at` /
  `frames` / `duration_ms` / `truncated` / `gaps` **全部已移除**。

  尺寸与帧数请改用 `GET .../recordings/{session_id}` 的 `artifacts`
  （`frames` 为 `frames/` 下 png 个数），或直接读取视频文件本身。
properties:
  session_id:
    type: string
    format: uuid
    description: 会话 id，即会话目录名；也是 `.../recordings/{session_id}` 系列接口的路径参数
  path:
    type: string
    description: |
      会话目录在**服务端磁盘上的路径**（`FSys::path` 直接序列化成字符串），即
      `<缓存根>/face_capture/sessions/<session_id>/`。

      给工作机（UE 转码等本机操作）直接定位录制文件用：它不是 HTTP URL，
      前端拿到后应自己拼 `take.webm` / `take.mp4` / `frames/` / `curves/face_curves.dhfc`
      去访问本机文件。分隔符由服务端平台决定（Windows 上是反斜杠，JSON 里转义成 `\\\\`），
      不要假定一定是正斜杠。
