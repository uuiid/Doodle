type: object
properties:
  id:
    type: string
    format: uuid
  name:
    type: string
    description: 实体名称
  description:
    type: string
    description: 实体描述（选填）
  ai_episode_id:
    type: string
    format: uuid
    description: 所属剧集ID
  ai_category_id:
    type: string
    format: uuid
    description: 所属实体类别ID（选填）
  shot_uuid_id:
    type: string
    format: uuid
    description: 关联镜头ID
  project_uuid_id:
    type: string
    format: uuid
    description: 关联项目ID
  preview_file:
    type: string
    format: uuid
    description: 预览文件ID
  generate_count:
    type: integer
    format: int64
    description: 生成次数
  main_task_id:
    type: string
    format: uuid
    description: 主要任务ID
  sub_task_list:
    type: array
    description: |
      次要任务列表，一对多；仅在
      `GET /api/seedance2/subproject/{subproject_id}/episodes/{episode_id}/entity` 的列表响应里返回，
      单实体查询接口不含本字段。无次要任务时为空数组。
    items:
      $ref: ./AiGenerateEntitySubTask.yaml
