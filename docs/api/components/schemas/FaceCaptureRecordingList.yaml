type: object
description: |
  `GET /api/doodle/local/face_capture/recordings` 的响应：会话目录列表。

  `data` 是扫描 `<缓存根>/face_capture/sessions/` 得到的**全部**含 `take.mp4` 或
  `take.webm` 的子目录，没有分页、没有过滤、没有排序保证（按文件系统遍历顺序）。
  **没有视频文件的目录不计入**（早期版本还会把仅有 `align.json` 的目录算作会话，
  该逻辑已随 `align.json` 一起删除）。`count` 就是 `data` 的长度。
properties:
  count:
    type: integer
    format: int64
    description: 命中的会话目录数量
  data:
    type: array
    description: 会话摘要列表
    items:
      $ref: ./FaceCaptureRecordingSummary.yaml
