type: object
description: |
  AI 工作室写入字段，POST 与 PUT 共用。

  全部字段均为选填：POST 时未提供的字段取默认值，PUT 时未提供的字段保持原值。
  可写字段与 `ai_studio::put_property_list()` 保持一致。
properties:
  name:
    type: string
    description: 工作室名称
  color:
    type: string
    description: 显示颜色
  archived:
    type: boolean
    description: 是否归档
  seedance2_key:
    type: string
    description: Seedance2 后端的 API Key，只写不读
  transfer_station_key:
    type: string
    description: 中转站后端的 API Key，只写不读
  apipy_key:
    type: string
    description: |
      API易（apiyi.com）图片后端的 API Key，只写不读。

      与上两把是**不同主机**的凭据，不能互相顶替：拿 `transfer_station_key` 去发 API易
      的请求等于把 A 家的密钥交给 B 家。
  gemini_key:
    type: string
    description: |
      Google 官方 Gemini 图片后端（`generativelanguage.googleapis.com`）的 API Key，只写不读。

      这是**第三台主机**的凭据：上面三把任何一把拿到这里都不能用。上游用 `x-goog-api-key`
      请求头鉴权，不是 `Authorization: Bearer`，服务端会自行换头，调用方不需要关心。

      该后端选用的后端类型为 `backend=gemini_image`（见 `TaskBackend.yaml`）。
