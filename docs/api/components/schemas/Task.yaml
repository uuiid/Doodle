type: object
properties:
  id:
    type: string
    format: uuid
  user_id:
    type: string
    format: uuid
    description: 提交用户ID
  status:
    $ref: ./TaskStatus.yaml
  type:
    $ref: ./TaskType.yaml
  backend:
    $ref: ./TaskBackend.yaml
  text_prompt:
    type: string
    description: 文本提示词
  model_name:
    type: string
    description: 任务实际使用的模型名（后端客户端从 data_request 解析后回填）；提交时可不传，传了也会被服务端解析结果覆盖
  preview_file:
    type: string
    format: uuid
    description: 预览文件ID
  data_request:
    type: object
    description: AI 请求数据
  file_extension:
    type: string
    description: 结果文件扩展名（含点，如 `.mp4` / `.png`）；任务成功后按真实结果文件回填，未成功时为空
  data_response:
    type: object
    description: AI 响应数据
  ai_studio_id:
    type: string
    format: uuid
    description: AI Studio ID
  created_at:
    type: string
    format: date-time
  ended_at:
    type: string
    format: date-time
  archived:
    type: boolean
  project_uuid_id:
    type: string
    format: uuid
    description: 关联项目ID
  completion_tokens:
    type: integer
    format: int64
    description: 任务消耗 Token（默认 200000）
  ai_generate_entity_id:
    type: string
    format: uuid
    description: 所属AI生成实体ID
  subproject_id:
    type: string
    format: uuid
    description: 所属子项目ID
  ai_light_session_id:
    type: string
    format: uuid
    nullable: true
    description: |
      外键 → `ai_light_session.uuid_id_`。AI 灯光的推理任务（`type=inference`）指向它所属的会话；
      非 AI 灯光来源的推理任务该字段为 nil。
  retry_count:
    type: integer
    format: int64
    description: 提交失败后的重试次数
