type: string
enum:
  - preparing
  - queued
  - running
  - cancelled
  - succeeded
  - failed
  - violation
  - expired
description: |
  preparing - 准备提交,
  queued - 排队中,
  running - 运行中,
  cancelled - 已取消（24h后自动删除）,
  succeeded - 成功,
  failed - 失败,
  violation - 违规（内容审核未通过、账号配额或免费额度受限），是否扣费取决于模型定价的 charge_on_violation,
  expired - 超时
