type: string
enum:
  - preparing
  - queued
  - running
  - cancelled
  - succeeded
  - failed
  - violation
  - expired
description: |
  preparing - 准备提交,
  queued - 排队中,
  running - 运行中,
  cancelled - 已取消（24h后自动删除）,
  succeeded - 成功,
  failed - 失败,
  violation - 违规（内容审核未通过、账号配额或免费额度受限），是否扣费取决于模型定价的 charge_on_violation,
  expired - 超时

  各后端对中间态的使用不同：`seedance2` 会走完 `preparing` / `queued` / `running`；
  `transfer_station` 只回到 `queued` 与 `running`；同步后端 `apipy_image`
  退回 `preparing` 表示「在服务端并发闸里等下一轮」，退回 `running` 表示「请求已在途、
  结果还没回来」，终态在提交那一刻就确定，不存在可轮询的中间态。
