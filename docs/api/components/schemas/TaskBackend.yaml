type: string
enum:
  - seedance2
  - transfer_station
  - apipy_image
  - gemini_image
description: |
  seedance2 - 豆包/火山方舟 Seedance2 后端（异步任务轮询，按 completion_tokens 计费）,
  transfer_station - 中转站后端（Grsai，按模型积分计费，失败/违规按模型策略返还）,
  apipy_image - API易（apiyi.com）图片后端（同步单次调用，无 task_id，按响应 usage 计费）,
  gemini_image - Google 官方 Gemini 图片后端（同步单次调用，无 task_id，按响应 usage 计费）

  `apipy_image` 是**同步后端**：上游不返回异步 task id、也没有查询接口，一次
  `/v1/images/generations`（无参考图）或 `/v1/images/edits`（有参考图）调用会占用连接
  2-4 分钟直到出结果。因此：

  - 只支持 `type=picture`；提交 `video` / `inference` 会直接置为 `failed`，不发出下游请求；
  - 服务端内部有并发闸（同时在途上限 10），超出时任务保持 `preparing` 等下一轮，不会排队到上游；
  - 任务行在提交那一刻就落终态，没有可轮询的中间态；服务端重启会让在途任务永久丢失，
    启动清理会把残留的 `running` 行置为 `failed`（`data_response.error` 说明原因）；
  - 不支持取消（`cancel_task` 直接抛错）。

  `data_request` 复用 `TransferStationTaskDataRequest.yaml` 的形状，但参考图的处理方式相反：
  本后端把参考图读成本地字节后作为 multipart 文件上传，**上游看不到 URL**，所以服务端
  不为其生成公网签名 URL。参考图必须是本站图片路由 `/api/seedance2/pictures/<uuid><扩展名>`
  且文件存在，最多 8 张、扩展名限 `.png` / `.jpg` / `.jpeg` / `.webp`；上传前会等比缩到长边
  2048 像素以内（放大不做）。

  `gemini_image` 同样是**同步后端**，与 `apipy_image` 的相同点：只支持 `type=picture`、
  同样有 10 路在途并发闸（与 API易 各自独立计，所以有自己的队列）、同样没有可轮询的中间态、
  同样不支持取消。它是**另一个上游**（`generativelanguage.googleapis.com`），差异如下：

  - 凭据取 `ai_studio.gemini_key`，上游以 `x-goog-api-key` 头鉴权，不是 `Bearer`；
  - `data_request` 仍复用 `TransferStationTaskDataRequest.yaml` 的形状，但字段含义做了转换：
    `quality` 被映射成 `generation_config.thinking_level`（`low`/`fast`/`draft` → `minimal`，
    `medium`/`standard`/`normal` → `medium`，`high`/`hd`/`vip`/`best` → `high`；已是合法级别则原样下发）；
    `imageSize` 只认大写 `1K` / `2K` / `4K`，`aspectRatio` 只认 `1:1` `2:3` `3:2` `3:4` `4:3`
    `4:5` `5:4` `9:16` `16:9` `21:9`；
  - 这三个字段的取值**认不出就直接返回 400**，不会静默兜底成默认值；留空表示不下发该字段，
    由模型自己决定（`imageSize` 留空即取模型默认分辨率）；
  - `background`、`mask`、`replyType` 在本后端不起作用；
  - 参考图必须命中本站图片路由且文件存在、扩展名限 `.png` / `.jpg` / `.jpeg`，没有张数上限；
    服务端会把参考图重新编码成 PNG 后以 base64 内联进请求，所以**上游同样看不到 URL**，
    也不为其生成签名 URL。参考图不做尺寸缩放；
  - 上游只以 base64 内联返回图片（没有下载 URL），响应里的图片会被剥掉 `data` 后落库，
    `data_response` 只保留 `id`、`status`、`usage` 与文字；
  - 返回 `status=completed` 但没有任何图片（提示词被安全策略拦下）按**终态失败**处理，
    不会重复提交；失败原因写在 `data_response.text` 或 `data_response.error` 里。
