openapi: "3.0.3"
info:
  title: Canvas API
  description: |
    无限画布模块 HTTP API，对齐 [infinite-canvas](https://github.com/basketikun/infinite-canvas) 前端库的数据模型。

    核心设计：画布"内容"（节点/连线）与"元数据"（画布信息/视口）分离存储，节点与连线均为独立记录。

    所有接口均需 JWT Bearer Token 认证（Header: `Authorization: Bearer <token>`）。
  version: "1.0.0"
  contact:
    name: 索以动画研发中心

servers:
  - url: http://localhost:50025
    description: 本地开发服务器

tags:
  - name: 画布
    description: 画布元数据 CRUD，视口与背景管理
  - name: 画布节点
    description: 画布上的 text/image/video/audio/config/group 节点管理
  - name: 画布连线
    description: 节点之间的连线管理
  - name: 画布媒体
    description: 画布节点的媒体文件（图片/视频/音频）上传、下载与元数据管理

security:
  - bearerAuth: []

paths:
  # ═══════════════ 画布 ═══════════════
  /api/canvas:
    get:
      tags: [画布]
      summary: 获取画布列表
      description: 获取指定项目下的所有画布
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: 项目ID
      responses:
        "200":
          description: 画布列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InfiniteCanvas"
    post:
      tags: [画布]
      summary: 创建画布
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, project_uuid_id]
              properties:
                title:
                  type: string
                  description: 画布名称
                description:
                  type: string
                  description: 画布描述
                project_uuid_id:
                  type: string
                  format: uuid
                  description: 所属项目ID
                backgroundMode:
                  $ref: "#/components/schemas/CanvasBackgroundMode"
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfiniteCanvas"

  /api/canvas/{canvas_id}:
    get:
      tags: [画布]
      summary: 获取画布详情
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 画布详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfiniteCanvas"
    put:
      tags: [画布]
      summary: 更新画布
      description: 可更新字段：title, description, viewport, backgroundMode
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                viewport:
                  $ref: "#/components/schemas/Viewport"
                backgroundMode:
                  $ref: "#/components/schemas/CanvasBackgroundMode"
      responses:
        "200":
          description: 更新后的画布信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfiniteCanvas"
    delete:
      tags: [画布]
      summary: 删除画布
      description: 删除画布及其下所有节点和连线
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 删除成功

  # ═══════════════ 画布节点 ═══════════════
  /api/canvas/{canvas_id}/node:
    get:
      tags: [画布节点]
      summary: 获取画布节点列表
      description: 返回指定画布下的所有节点
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 节点列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CanvasNode"
    post:
      tags: [画布节点]
      summary: 创建画布节点
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  $ref: "#/components/schemas/CanvasNodeType"
                title:
                  type: string
                  description: 节点标题
                position:
                  $ref: "#/components/schemas/Position"
                width:
                  type: number
                  format: double
                  default: 340
                height:
                  type: number
                  format: double
                  default: 240
                content:
                  type: string
                  description: 节点内容（文本 或 媒体URL）
                metadata:
                  type: object
                  description: 扩展元数据（prompt, status, model, size, generationMode 等）
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasNode"

  /api/canvas/{canvas_id}/node/{node_id}:
    get:
      tags: [画布节点]
      summary: 获取画布节点详情
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 节点详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasNode"
    put:
      tags: [画布节点]
      summary: 更新画布节点
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  $ref: "#/components/schemas/CanvasNodeType"
                title:
                  type: string
                position:
                  $ref: "#/components/schemas/Position"
                width:
                  type: number
                  format: double
                height:
                  type: number
                  format: double
                content:
                  type: string
                metadata:
                  type: object
      responses:
        "200":
          description: 更新后的节点信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasNode"
    delete:
      tags: [画布节点]
      summary: 删除画布节点
      description: 删除节点及其关联的所有连线
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 删除成功

  # ═══════════════ 画布连线 ═══════════════
  /api/canvas/{canvas_id}/connection:
    get:
      tags: [画布连线]
      summary: 获取画布连线列表
      description: 返回指定画布下的所有节点间连线
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 连线列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CanvasConnection"
    post:
      tags: [画布连线]
      summary: 创建画布连线
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromNodeId, toNodeId]
              properties:
                fromNodeId:
                  type: string
                  format: uuid
                  description: 起始节点ID
                toNodeId:
                  type: string
                  format: uuid
                  description: 目标节点ID
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasConnection"

  /api/canvas/{canvas_id}/connection/{connection_id}:
    delete:
      tags: [画布连线]
      summary: 删除画布连线
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 删除成功

  # ═══════════════ 画布媒体 ═══════════════
  /api/canvas/{canvas_id}/node/{node_id}/media:
    get:
      tags: [画布媒体]
      summary: 获取节点媒体列表
      description: 返回指定节点的所有媒体文件元数据
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 媒体列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CanvasMedia"
    post:
      tags: [画布媒体]
      summary: 上传媒体文件并创建媒体记录
      description: |
        上传媒体文件到节点。请求体使用 multipart/form-data。
        上传成功后自动创建 canvas_media 记录，并生成缩略图。
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 媒体文件
      responses:
        "200":
          description: 上传成功，返回媒体元数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasMedia"

  /api/canvas/{canvas_id}/node/{node_id}/media/{media_id}:
    get:
      tags: [画布媒体]
      summary: 获取媒体详情
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: media_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 媒体详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasMedia"
    put:
      tags: [画布媒体]
      summary: 更新媒体元数据
      description: 更新媒体属性（width, height, duration, original_name, metadata 等）
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: media_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                width:
                  type: integer
                  description: 宽度 px
                height:
                  type: integer
                  description: 高度 px
                duration:
                  type: number
                  format: double
                  description: 时长 秒
                original_name:
                  type: string
                  description: 原始文件名
                metadata:
                  type: object
                  description: 扩展元数据（codec, bitrate, framerate, mime_type 等）
      responses:
        "200":
          description: 更新后的媒体信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasMedia"
    delete:
      tags: [画布媒体]
      summary: 删除媒体记录及文件
      description: 删除 canvas_media 记录及其所有版本的磁盘文件（原始 + 缩略图 + 预览）
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: media_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 删除成功

  /api/canvas/{canvas_id}/node/{node_id}/media/{media_id}/file/{role}:
    get:
      tags: [画布媒体]
      summary: 下载媒体文件
      description: |
        按 media_role 下载对应版本的文件。
        
        缩略图固定为 PNG 格式；原始文件按 file_extension 返回；预览按 preview_extension 返回。
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: media_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: role
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MediaRole"
      responses:
        "200":
          description: 媒体文件二进制流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          description: 文件不存在
    put:
      tags: [画布媒体]
      summary: 替换媒体文件
      description: |
        按 media_role 替换对应版本的文件（如单独上传缩略图或预览版本）。
        请求体使用 multipart/form-data。
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: media_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: role
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MediaRole"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: 媒体文件
      responses:
        "200":
          description: 替换成功，返回更新后的媒体元数据
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasMedia"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token 认证

  schemas:
    # ═══════════════ 通用 ═══════════════
    Position:
      type: object
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double

    Viewport:
      type: object
      description: "视口状态，对齐前端 viewport: {x, y, k}"
      properties:
        x:
          type: number
          format: double
          description: 水平偏移
        y:
          type: number
          format: double
          description: 垂直偏移
        k:
          type: number
          format: double
          description: 缩放比例（1.0 = 100%）

    # ═══════════════ 画布 ═══════════════
    CanvasBackgroundMode:
      type: string
      enum: [blank, lines, dots]
      description: |
        blank - 空白背景
        lines - 网格线
        dots  - 网点

    InfiniteCanvas:
      type: object
      description: 画布元数据，对齐前端 CanvasProject
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: 画布名称
        description:
          type: string
          description: 画布描述
        project_uuid_id:
          type: string
          format: uuid
          description: 所属项目ID
        user_id:
          type: string
          format: uuid
          description: 创建者ID
        viewport:
          $ref: "#/components/schemas/Viewport"
        backgroundMode:
          $ref: "#/components/schemas/CanvasBackgroundMode"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ═══════════════ 画布节点 ═══════════════
    CanvasNodeType:
      type: string
      enum: [text, image, video, audio, config, group]
      description: |
        text   - 文本节点
        image  - 图片节点
        video  - 视频节点
        audio  - 音频节点
        config - 生成配置节点（模型/参数/提示词）
        group  - 分组节点

    CanvasNode:
      type: object
      description: 画布节点，对齐前端 CanvasNodeData
      properties:
        id:
          type: string
          format: uuid
        canvas_id:
          type: string
          format: uuid
          description: 所属画布ID
        type:
          $ref: "#/components/schemas/CanvasNodeType"
        title:
          type: string
          description: 节点标题
        position:
          $ref: "#/components/schemas/Position"
        width:
          type: number
          format: double
          description: 节点宽度
        height:
          type: number
          format: double
          description: 节点高度
        metadata:
          type: object
          description: |
            扩展元数据扁平可选字段袋。常用字段：
            - content: 文本内容 或 媒体URL
            - prompt: 提示词
            - status: idle | success | loading | error
            - generationMode: text | image | video | audio
            - model, size, count, quality 等生成参数
            - groupId: 所属分组节点ID
            - storageKey, mimeType, bytes, naturalWidth, naturalHeight
            - 插件可写入任意自定义字段
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ═══════════════ 画布连线 ═══════════════
    CanvasConnection:
      type: object
      description: 节点连线，对齐前端 CanvasConnection。样式字段为后端扩展。
      properties:
        id:
          type: string
          format: uuid
        canvas_id:
          type: string
          format: uuid
          description: 所属画布ID
        fromNodeId:
          type: string
          format: uuid
          description: 起始节点ID
        toNodeId:
          type: string
          format: uuid
          description: 目标节点ID
        label:
          type: string
          description: 连线标签（后端扩展）
        color:
          type: string
          description: 连线颜色（后端扩展）
        width:
          type: number
          format: double
          description: 连线宽度（后端扩展）
        dashPattern:
          type: string
          description: 虚线样式（后端扩展）
        directed:
          type: boolean
          description: 是否有箭头（后端扩展）
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ═══════════════ 画布媒体 ═══════════════
    MediaRole:
      type: string
      enum: [original, thumbnail, preview, variant]
      description: |
        媒体版本角色，用于区分同一媒体的不同文件版本：
        - original  — 原始上传文件
        - thumbnail — 缩略图（固定 PNG 格式）
        - preview   — 预览/压缩版本
        - variant   — 其他变体

    CanvasMedia:
      type: object
      description: |
        画布节点媒体文件元数据，与 canvas_element 分离存储。
        单条记录包含多个版本文件（原始/缩略图/预览），各版本通过 MediaRole 区分 URL 请求。
        文件路径由后端 kitsu_ctx_t 根据 uuid + role 派生，不暴露磁盘路径。
      properties:
        id:
          type: string
          format: uuid
          description: 媒体记录ID
        canvas_element_id:
          type: string
          format: uuid
          description: 所属画布节点ID (canvas_element.uuid_id_)
        file_extension:
          type: string
          description: 原始文件扩展名（含点，如 ".png", ".mp4"）
          example: ".png"
        preview_extension:
          type: string
          description: 预览文件扩展名（含点，不存在则为空）
          example: ".mp4"
        width:
          type: integer
          description: 媒体宽度 px（以原始文件为准）
        height:
          type: integer
          description: 媒体高度 px（以原始文件为准）
        duration:
          type: number
          format: double
          description: 时长 秒（视频/音频，图片为 0）
        original_name:
          type: string
          description: 上传时的原始文件名
        metadata:
          type: object
          description: |
            扩展元数据，常用字段：
            - codec: 编码格式
            - bitrate: 比特率
            - framerate: 帧率
            - mime_type: MIME 类型
            - 插件可写入任意自定义字段
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time