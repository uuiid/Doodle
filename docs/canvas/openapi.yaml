openapi: "3.0.3"
info:
  title: Canvas API
  description: |
    无限画布模块 HTTP API，对齐 [infinite-canvas](https://github.com/basketikun/infinite-canvas) 前端库的数据模型。

    核心设计：画布"内容"（节点/连线）与"元数据"（画布信息/视口）分离存储，节点与连线均为独立记录。

    所有接口均需 JWT Bearer Token 认证（Header: `Authorization: Bearer <token>`）。
  version: "1.0.0"
  contact:
    name: 索以动画研发中心

servers:
  - url: http://localhost:50025
    description: 本地开发服务器

tags:
  - name: 画布
    description: 画布元数据 CRUD，视口与背景管理
  - name: 画布节点
    description: 画布上的 text/image/video/audio/config/group 节点管理
  - name: 画布连线
    description: 节点之间的连线管理

security:
  - bearerAuth: []

paths:
  # ═══════════════ 画布 ═══════════════
  /api/canvas:
    get:
      tags: [画布]
      summary: 获取画布列表
      description: 获取指定项目下的所有画布
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: 项目ID
      responses:
        "200":
          description: 画布列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InfiniteCanvas"
    post:
      tags: [画布]
      summary: 创建画布
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, project_uuid_id]
              properties:
                title:
                  type: string
                  description: 画布名称
                description:
                  type: string
                  description: 画布描述
                project_uuid_id:
                  type: string
                  format: uuid
                  description: 所属项目ID
                backgroundMode:
                  $ref: "#/components/schemas/CanvasBackgroundMode"
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfiniteCanvas"

  /api/canvas/{canvas_id}:
    get:
      tags: [画布]
      summary: 获取画布详情
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 画布详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfiniteCanvas"
    put:
      tags: [画布]
      summary: 更新画布
      description: 可更新字段：title, description, viewport, backgroundMode
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                viewport:
                  $ref: "#/components/schemas/Viewport"
                backgroundMode:
                  $ref: "#/components/schemas/CanvasBackgroundMode"
      responses:
        "200":
          description: 更新后的画布信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfiniteCanvas"
    delete:
      tags: [画布]
      summary: 删除画布
      description: 删除画布及其下所有节点和连线
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 删除成功

  # ═══════════════ 画布节点 ═══════════════
  /api/canvas/{canvas_id}/node:
    get:
      tags: [画布节点]
      summary: 获取画布节点列表
      description: 返回指定画布下的所有节点
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 节点列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CanvasNode"
    post:
      tags: [画布节点]
      summary: 创建画布节点
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type:
                  $ref: "#/components/schemas/CanvasNodeType"
                title:
                  type: string
                  description: 节点标题
                position:
                  $ref: "#/components/schemas/Position"
                width:
                  type: number
                  format: double
                  default: 340
                height:
                  type: number
                  format: double
                  default: 240
                content:
                  type: string
                  description: 节点内容（文本 或 媒体URL）
                metadata:
                  type: object
                  description: 扩展元数据（prompt, status, model, size, generationMode 等）
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasNode"

  /api/canvas/{canvas_id}/node/{node_id}:
    get:
      tags: [画布节点]
      summary: 获取画布节点详情
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 节点详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasNode"
    put:
      tags: [画布节点]
      summary: 更新画布节点
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  $ref: "#/components/schemas/CanvasNodeType"
                title:
                  type: string
                position:
                  $ref: "#/components/schemas/Position"
                width:
                  type: number
                  format: double
                height:
                  type: number
                  format: double
                content:
                  type: string
                metadata:
                  type: object
      responses:
        "200":
          description: 更新后的节点信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasNode"
    delete:
      tags: [画布节点]
      summary: 删除画布节点
      description: 删除节点及其关联的所有连线
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 删除成功

  # ═══════════════ 画布连线 ═══════════════
  /api/canvas/{canvas_id}/connection:
    get:
      tags: [画布连线]
      summary: 获取画布连线列表
      description: 返回指定画布下的所有节点间连线
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 连线列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CanvasConnection"
    post:
      tags: [画布连线]
      summary: 创建画布连线
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromNodeId, toNodeId]
              properties:
                fromNodeId:
                  type: string
                  format: uuid
                  description: 起始节点ID
                toNodeId:
                  type: string
                  format: uuid
                  description: 目标节点ID
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasConnection"

  /api/canvas/{canvas_id}/connection/{connection_id}:
    delete:
      tags: [画布连线]
      summary: 删除画布连线
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 删除成功

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token 认证

  schemas:
    # ═══════════════ 通用 ═══════════════
    Position:
      type: object
      properties:
        x:
          type: number
          format: double
        y:
          type: number
          format: double

    Viewport:
      type: object
      description: 视口状态，对齐前端 viewport: {x, y, k}
      properties:
        x:
          type: number
          format: double
          description: 水平偏移
        y:
          type: number
          format: double
          description: 垂直偏移
        k:
          type: number
          format: double
          description: 缩放比例（1.0 = 100%）

    # ═══════════════ 画布 ═══════════════
    CanvasBackgroundMode:
      type: string
      enum: [blank, lines, dots]
      description: |
        blank - 空白背景
        lines - 网格线
        dots  - 网点

    InfiniteCanvas:
      type: object
      description: 画布元数据，对齐前端 CanvasProject
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: 画布名称
        description:
          type: string
          description: 画布描述
        project_uuid_id:
          type: string
          format: uuid
          description: 所属项目ID
        user_id:
          type: string
          format: uuid
          description: 创建者ID
        viewport:
          $ref: "#/components/schemas/Viewport"
        backgroundMode:
          $ref: "#/components/schemas/CanvasBackgroundMode"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ═══════════════ 画布节点 ═══════════════
    CanvasNodeType:
      type: string
      enum: [text, image, video, audio, config, group]
      description: |
        text   - 文本节点
        image  - 图片节点
        video  - 视频节点
        audio  - 音频节点
        config - 生成配置节点（模型/参数/提示词）
        group  - 分组节点

    CanvasNode:
      type: object
      description: 画布节点，对齐前端 CanvasNodeData
      properties:
        id:
          type: string
          format: uuid
        canvas_id:
          type: string
          format: uuid
          description: 所属画布ID
        type:
          $ref: "#/components/schemas/CanvasNodeType"
        title:
          type: string
          description: 节点标题
        position:
          $ref: "#/components/schemas/Position"
        width:
          type: number
          format: double
          description: 节点宽度
        height:
          type: number
          format: double
          description: 节点高度
        metadata:
          type: object
          description: |
            扩展元数据扁平可选字段袋。常用字段：
            - content: 文本内容 或 媒体URL
            - prompt: 提示词
            - status: idle | success | loading | error
            - generationMode: text | image | video | audio
            - model, size, count, quality 等生成参数
            - groupId: 所属分组节点ID
            - storageKey, mimeType, bytes, naturalWidth, naturalHeight
            - 插件可写入任意自定义字段
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ═══════════════ 画布连线 ═══════════════
    CanvasConnection:
      type: object
      description: 节点连线，对齐前端 CanvasConnection。样式字段为后端扩展。
      properties:
        id:
          type: string
          format: uuid
        canvas_id:
          type: string
          format: uuid
          description: 所属画布ID
        fromNodeId:
          type: string
          format: uuid
          description: 起始节点ID
        toNodeId:
          type: string
          format: uuid
          description: 目标节点ID
        label:
          type: string
          description: 连线标签（后端扩展）
        color:
          type: string
          description: 连线颜色（后端扩展）
        width:
          type: number
          format: double
          description: 连线宽度（后端扩展）
        dashPattern:
          type: string
          description: 虚线样式（后端扩展）
        directed:
          type: boolean
          description: 是否有箭头（后端扩展）
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time