openapi: "3.0.3"
info:
  title: Canvas API
  description: |
    无限画布模块 HTTP API，提供画布元数据、画布元素（文本/图片/视频/音频）及元素间链接的管理功能。

    核心设计：画布"内容"（元素/链接）与"元数据"（画布信息/视口）分离存储，元素与链接均为独立记录。

    所有接口均需 JWT Bearer Token 认证（Header: `Authorization: Bearer <token>`）。
  version: "1.0.0"
  contact:
    name: 索以动画研发中心

servers:
  - url: http://localhost:50025
    description: 本地开发服务器

tags:
  - name: 画布
    description: 画布元数据 CRUD，视口状态管理
  - name: 画布元素
    description: 画布上的文本、图片、视频、音频元素管理
  - name: 画布链接
    description: 元素之间的连线/边管理

security:
  - bearerAuth: []

paths:
  # ═══════════════ 画布 ═══════════════
  /api/canvas:
    get:
      tags: [画布]
      summary: 获取画布列表
      description: 获取指定项目下的所有画布
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: 项目ID
      responses:
        "200":
          description: 画布列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InfiniteCanvas"
    post:
      tags: [画布]
      summary: 创建画布
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, project_uuid_id]
              properties:
                name:
                  type: string
                  description: 画布名称
                description:
                  type: string
                  description: 画布描述
                project_uuid_id:
                  type: string
                  format: uuid
                  description: 所属项目ID
                background_color:
                  type: string
                  default: "#ffffff"
                  description: 背景色
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfiniteCanvas"

  /api/canvas/{canvas_id}:
    get:
      tags: [画布]
      summary: 获取画布详情
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 画布详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfiniteCanvas"
    put:
      tags: [画布]
      summary: 更新画布
      description: 可更新字段：name, description, viewport_x, viewport_y, viewport_zoom, background_color
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                viewport_x:
                  type: number
                  format: double
                viewport_y:
                  type: number
                  format: double
                viewport_zoom:
                  type: number
                  format: double
                background_color:
                  type: string
      responses:
        "200":
          description: 更新后的画布信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfiniteCanvas"
    delete:
      tags: [画布]
      summary: 删除画布
      description: 删除画布及其下所有元素和链接
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 删除成功

  # ═══════════════ 画布元素 ═══════════════
  /api/canvas/{canvas_id}/element:
    get:
      tags: [画布元素]
      summary: 获取画布元素列表
      description: 返回指定画布下的所有元素，按 z_index 排序
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 元素列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CanvasElement"
    post:
      tags: [画布元素]
      summary: 创建画布元素
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [element_type]
              properties:
                element_type:
                  $ref: "#/components/schemas/CanvasElementType"
                name:
                  type: string
                  description: 元素名称
                position_x:
                  type: number
                  format: double
                  default: 0
                position_y:
                  type: number
                  format: double
                  default: 0
                width:
                  type: number
                  format: double
                  default: 100
                height:
                  type: number
                  format: double
                  default: 100
                rotation:
                  type: number
                  format: double
                  default: 0
                z_index:
                  type: integer
                  format: int32
                  default: 0
                fill_color:
                  type: string
                  default: "#ffffff"
                stroke_color:
                  type: string
                  default: "#000000"
                stroke_width:
                  type: number
                  format: double
                  default: 1
                opacity:
                  type: number
                  format: double
                  default: 1
                text_content:
                  type: string
                  description: 文本内容（text 类型）
                image_url:
                  type: string
                  description: 图片URL（image 类型）
                video_url:
                  type: string
                  description: 视频URL（video 类型）
                audio_url:
                  type: string
                  description: 音频URL（audio 类型）
                parent_id:
                  type: string
                  format: uuid
                  description: 父元素ID（用于嵌套）
                locked:
                  type: boolean
                  default: false
                visible:
                  type: boolean
                  default: true
                custom_data:
                  type: object
                  description: 自定义扩展数据
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasElement"

  /api/canvas/{canvas_id}/element/{element_id}:
    get:
      tags: [画布元素]
      summary: 获取画布元素详情
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: element_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 元素详情
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasElement"
    put:
      tags: [画布元素]
      summary: 更新画布元素
      description: 更新元素的位置、大小、样式、内容等属性
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: element_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                element_type:
                  $ref: "#/components/schemas/CanvasElementType"
                name:
                  type: string
                position_x:
                  type: number
                  format: double
                position_y:
                  type: number
                  format: double
                width:
                  type: number
                  format: double
                height:
                  type: number
                  format: double
                rotation:
                  type: number
                  format: double
                z_index:
                  type: integer
                  format: int32
                fill_color:
                  type: string
                stroke_color:
                  type: string
                stroke_width:
                  type: number
                  format: double
                opacity:
                  type: number
                  format: double
                text_content:
                  type: string
                image_url:
                  type: string
                video_url:
                  type: string
                audio_url:
                  type: string
                parent_id:
                  type: string
                  format: uuid
                locked:
                  type: boolean
                visible:
                  type: boolean
                custom_data:
                  type: object
      responses:
        "200":
          description: 更新后的元素信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasElement"
    delete:
      tags: [画布元素]
      summary: 删除画布元素
      description: 删除元素及其关联的所有链接
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: element_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 删除成功

  # ═══════════════ 画布链接 ═══════════════
  /api/canvas/{canvas_id}/link:
    get:
      tags: [画布链接]
      summary: 获取画布链接列表
      description: 返回指定画布下的所有元素间链接
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: 链接列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CanvasLink"
    post:
      tags: [画布链接]
      summary: 创建画布链接
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_id, target_id]
              properties:
                source_id:
                  type: string
                  format: uuid
                  description: 起始元素ID
                target_id:
                  type: string
                  format: uuid
                  description: 目标元素ID
                link_type:
                  $ref: "#/components/schemas/CanvasLinkType"
                label:
                  type: string
                  description: 链接标签
                color:
                  type: string
                  default: "#000000"
                width:
                  type: number
                  format: double
                  default: 2
                dash_pattern:
                  type: string
                  description: 虚线样式，如 "5,5"
                directed:
                  type: boolean
                  default: false
      responses:
        "200":
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasLink"

  /api/canvas/{canvas_id}/link/{link_id}:
    put:
      tags: [画布链接]
      summary: 更新画布链接
      description: 更新链接的样式、标签、方向等属性
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: link_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                link_type:
                  $ref: "#/components/schemas/CanvasLinkType"
                label:
                  type: string
                color:
                  type: string
                width:
                  type: number
                  format: double
                dash_pattern:
                  type: string
                directed:
                  type: boolean
      responses:
        "200":
          description: 更新后的链接信息
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CanvasLink"
    delete:
      tags: [画布链接]
      summary: 删除画布链接
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: link_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: 删除成功

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token 认证

  schemas:
    # ═══════════════ 画布 ═══════════════
    InfiniteCanvas:
      type: object
      description: 无限画布元数据，与画布内容（元素/链接）分离存储
      properties:
        id:
          type: string
          format: uuid
          description: 画布ID
        name:
          type: string
          description: 画布名称
        description:
          type: string
          description: 画布描述
        project_uuid_id:
          type: string
          format: uuid
          description: 所属项目ID
        user_id:
          type: string
          format: uuid
          description: 创建者ID
        viewport_x:
          type: number
          format: double
          description: 视口水平偏移
        viewport_y:
          type: number
          format: double
          description: 视口垂直偏移
        viewport_zoom:
          type: number
          format: double
          description: 视口缩放
        background_color:
          type: string
          description: 背景色
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ═══════════════ 画布元素 ═══════════════
    CanvasElementType:
      type: string
      enum: [text, image, video, audio]
      description: |
        text  - 文本元素
        image - 图片元素
        video - 视频元素
        audio - 音频元素

    CanvasElement:
      type: object
      description: 画布上的单个元素，独立记录存储
      properties:
        id:
          type: string
          format: uuid
        canvas_id:
          type: string
          format: uuid
          description: 所属画布ID
        element_type:
          $ref: "#/components/schemas/CanvasElementType"
        name:
          type: string
          description: 元素名称
        position_x:
          type: number
          format: double
          description: 水平位置
        position_y:
          type: number
          format: double
          description: 垂直位置
        width:
          type: number
          format: double
          description: 宽度
        height:
          type: number
          format: double
          description: 高度
        rotation:
          type: number
          format: double
          description: 旋转角度（度）
        z_index:
          type: integer
          format: int32
          description: 层级
        fill_color:
          type: string
          description: 填充色
        stroke_color:
          type: string
          description: 描边色
        stroke_width:
          type: number
          format: double
          description: 描边宽度
        opacity:
          type: number
          format: double
          description: 不透明度 [0, 1]
        text_content:
          type: string
          description: 文本内容（text 类型）
        image_url:
          type: string
          description: 图片URL（image 类型）
        video_url:
          type: string
          description: 视频URL（video 类型）
        audio_url:
          type: string
          description: 音频URL（audio 类型）
        parent_id:
          type: string
          format: uuid
          description: 父元素ID（用于嵌套）
        locked:
          type: boolean
          description: 是否锁定
        visible:
          type: boolean
          description: 是否可见
        custom_data:
          type: object
          description: 任意自定义属性
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    # ═══════════════ 画布链接 ═══════════════
    CanvasLinkType:
      type: string
      enum: [straight, curved, orthogonal]
      description: |
        straight   - 直线
        curved     - 曲线
        orthogonal - 正交折线

    CanvasLink:
      type: object
      description: 画布节点之间的链接，独立记录存储
      properties:
        id:
          type: string
          format: uuid
        canvas_id:
          type: string
          format: uuid
          description: 所属画布ID
        source_id:
          type: string
          format: uuid
          description: 起始元素ID
        target_id:
          type: string
          format: uuid
          description: 目标元素ID
        link_type:
          $ref: "#/components/schemas/CanvasLinkType"
        label:
          type: string
          description: 链接上的标签文字
        color:
          type: string
          description: 连线颜色
        width:
          type: number
          format: double
          description: 连线宽度
        dash_pattern:
          type: string
          description: 虚线样式，如 "5,5"；空串为实线
        directed:
          type: boolean
          description: 是否有箭头
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time