get:
  tags:
    - 任务
  summary: 获取任务详情
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: 任务详情
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Task.yaml
put:
  tags:
    - 任务
  summary: 取消任务
  description: 向外部服务发送取消请求，并将状态设为 cancelled
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: 取消后的任务信息
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Task.yaml
delete:
  tags:
    - 任务
  summary: 归档任务
  description: 软删除，设置 archived=true
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: 归档成功
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
