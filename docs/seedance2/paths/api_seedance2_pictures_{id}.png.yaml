get:
  tags:
    - 静态文件
  summary: 获取图片
  description: 根据预览文件 ID 获取原始图片/视频文件
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: 图片/视频二进制数据
      content:
        image/png: {}
        video/mp4: {}
    '404':
      description: 文件不存在
