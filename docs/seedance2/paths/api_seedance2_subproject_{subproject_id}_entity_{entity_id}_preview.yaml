post:
  tags:
    - AI生成实体
  summary: 上传实体预览图
  description: 上传图片作为实体预览，自动生成缩略图
  parameters:
    - name: subproject_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: entity_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          type: object
          properties:
            file:
              type: string
              format: binary
              description: 图片文件
  responses:
    '200':
      description: 上传成功
      content:
        application/json:
          schema:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: 预览文件ID
