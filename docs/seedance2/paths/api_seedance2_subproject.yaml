get:
  tags:
    - 子项目
  summary: 获取子项目列表
  description: |
    获取当前用户可见的子项目列表。
    - 制片/管理员：查看所有子项目
    - 普通用户：仅查看自己参与的子项目
  responses:
    '200':
      description: 子项目列表
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: ../components/schemas/Subproject.yaml
post:
  tags:
    - 子项目
  summary: 创建子项目
  description: 制片及以上权限可创建子项目
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          required:
            - name
            - project_id
          properties:
            name:
              type: string
              description: 子项目名称
            project_id:
              type: string
              format: uuid
              description: 关联项目ID
  responses:
    '200':
      description: 创建成功，返回完整子项目信息
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Subproject.yaml
