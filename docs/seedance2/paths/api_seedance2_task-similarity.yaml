get:
  tags:
    - 限额管理
  summary: 获取任务相似度预警信息
  description: |
    制片及以上可查看。返回所有人员提交任务的相似度预警信息，按人员分组。
    用于发现重复或高度相似的任务提交，相似度 >= 75 的记录才会被收录。
    支持分页查询。
  parameters:
    - name: offset
      in: query
      schema:
        type: integer
        default: 0
      description: 分页偏移量
    - name: limit
      in: query
      schema:
        type: integer
        default: 300
      description: 每页返回条数上限
  responses:
    '200':
      description: 按人员分组的任务相似度信息
      content:
        application/json:
          schema:
            $ref: ../components/schemas/TaskSimilarityPerson.yaml
