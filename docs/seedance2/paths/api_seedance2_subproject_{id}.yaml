get:
  tags:
    - 子项目
  summary: 获取子项目详情
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    '200':
      description: 子项目详情
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Subproject.yaml
put:
  tags:
    - 子项目
  summary: 更新子项目
  description: 制片及以上权限可更新子项目。可更新字段：name, project_id
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            name:
              type: string
            project_id:
              type: string
              format: uuid
  responses:
    '200':
      description: 更新后的子项目信息
      content:
        application/json:
          schema:
            $ref: ../components/schemas/Subproject.yaml
delete:
  tags:
    - 子项目
  summary: 删除/归档子项目
  description: |
    制片及以上权限可操作。
    - 默认软删除（归档），设置 archived=true
    - 传 `?force=true` 则硬删除
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    - name: force
      in: query
      schema:
        type: boolean
  responses:
    '204':
      description: 删除成功
