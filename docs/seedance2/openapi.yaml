openapi: 3.0.3
info:
  title: Seedance2 API
  description: |
    Seedance2 模块 HTTP API，提供子项目管理、AI 生成分类/实体/任务及 Token 限额管理功能。

    所有接口均需 JWT Bearer Token 认证（Header: `Authorization: Bearer <token>`）。
  version: 1.0.0
  contact:
    name: 索以动画研发中心
servers:
  - url: http://localhost:50025
    description: 本地开发服务器
tags:
  - name: 静态文件
    description: 缩略图、图片、动画等静态资源
  - name: 子项目
    description: 子项目 CRUD、参与人员关联
  - name: AI实体类别
    description: AI 生成实体类别管理
  - name: AI生成实体
    description: AI 生成实体及预览、参考文件管理
  - name: 任务
    description: AI 生成任务提交、查询、取消、归档
  - name: 限额管理
    description: Token 配额查询与设置
security:
  - bearerAuth: []
paths:
  /api/seedance2/thumbnail/{id}.png:
    $ref: paths/api_seedance2_thumbnail_{id}.png.yaml
  /api/seedance2/pictures/{id}.png:
    $ref: paths/api_seedance2_pictures_{id}.png.yaml
  /api/seedance2/animation/waiting.mp4:
    $ref: paths/api_seedance2_animation_waiting.mp4.yaml
  /api/seedance2/subproject:
    $ref: paths/api_seedance2_subproject.yaml
  /api/seedance2/subproject/{id}:
    $ref: paths/api_seedance2_subproject_{id}.yaml
  /api/seedance2/subproject/{id}/preview:
    $ref: paths/api_seedance2_subproject_{id}_preview.yaml
  /api/seedance2/subproject/{subproject_id}/person:
    $ref: paths/api_seedance2_subproject_{subproject_id}_person.yaml
  /api/seedance2/subproject/{subproject_id}/episodes:
    $ref: paths/api_seedance2_subproject_{subproject_id}_episodes.yaml
  /api/seedance2/subproject/{subproject_id}/episodes/{episode_id}:
    $ref: paths/api_seedance2_subproject_{subproject_id}_episodes_{episode_id}.yaml
  /api/seedance2/subproject/{subproject_id}/entity:
    $ref: paths/api_seedance2_subproject_{subproject_id}_entity.yaml
  /api/seedance2/subproject/{subproject_id}/episodes/{episode_id}/entity:
    $ref: >-
      paths/api_seedance2_subproject_{subproject_id}_episodes_{episode_id}_entity.yaml
  /api/seedance2/subproject/{subproject_id}/entity/{entity_id}:
    $ref: paths/api_seedance2_subproject_{subproject_id}_entity_{entity_id}.yaml
  /api/seedance2/subproject/{subproject_id}/entity/{entity_id}/preview:
    $ref: >-
      paths/api_seedance2_subproject_{subproject_id}_entity_{entity_id}_preview.yaml
  /api/seedance2/subproject/{subproject_id}/entity/{entity_id}/reference:
    $ref: >-
      paths/api_seedance2_subproject_{subproject_id}_entity_{entity_id}_reference.yaml
  /api/seedance2/subproject/{subproject_id}/reference/{id}:
    $ref: paths/api_seedance2_subproject_{subproject_id}_reference_{id}.yaml
  /api/seedance2/subproject/{subproject_id}/category:
    $ref: paths/api_seedance2_subproject_{subproject_id}_category.yaml
  /api/seedance2/subproject/{subproject_id}/category/{category_id}:
    $ref: paths/api_seedance2_subproject_{subproject_id}_category_{category_id}.yaml
  /api/seedance2/subproject/{subproject_id}/category/{category_id}/entity:
    $ref: >-
      paths/api_seedance2_subproject_{subproject_id}_category_{category_id}_entity.yaml
  /api/seedance2/subproject/{subproject_id}/entity/{entity_id}/task:
    $ref: >-
      paths/api_seedance2_subproject_{subproject_id}_entity_{entity_id}_task.yaml
  /api/seedance2/subproject/{subproject_id}/task/{id}:
    $ref: paths/api_seedance2_subproject_{subproject_id}_task_{id}.yaml
  /api/seedance2/task:
    $ref: paths/api_seedance2_task.yaml
  /api/seedance2/task/{date_start}-{date_end}:
    $ref: paths/api_seedance2_task_{date_start}-{date_end}.yaml
  /api/seedance2/tokens:
    $ref: paths/api_seedance2_tokens.yaml
  /api/seedance2/tokens/person/{person_id}:
    $ref: paths/api_seedance2_tokens_person_{person_id}.yaml
  /api/seedance2/tokens/person/all:
    $ref: paths/api_seedance2_tokens_person_all.yaml
  /api/seedance2/tokens/person/{person_id}/date/{date_start}-{date_end}:
    $ref: >-
      paths/api_seedance2_tokens_person_{person_id}_date_{date_start}-{date_end}.yaml
  /api/seedance2/tokens/person/{person_id}/date/{date}:
    $ref: paths/api_seedance2_tokens_person_{person_id}_date_{date}.yaml
  /api/seedance2/tokens/person/date/{date_start}-{date_end}:
    $ref: paths/api_seedance2_tokens_person_date_{date_start}-{date_end}.yaml
  /api/seedance2/tokens/person/date/{date}:
    $ref: paths/api_seedance2_tokens_person_date_{date}.yaml
  /api/seedance2/task-similarity:
    $ref: paths/api_seedance2_task-similarity.yaml
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token 认证
