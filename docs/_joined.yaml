openapi: 3.0.3
info:
  title: AI 动画生成 API
  description: |
    AI 动画训练/生成模块 HTTP API，基于 Kimodo 运动生成模型，提供模型加载与多段运动生成能力。

    使用前须先调用 `settings` 接口加载模型，再调用 `train` 接口生成动画。

    所有接口均需 JWT Bearer Token 认证（Header: `Authorization: Bearer <token>`）。
  version: 1.0.0
  contact:
    name: 索以动画研发中心
servers:
  - url: http://localhost:50025
    description: 本地开发服务器
tags:
  - name: 模型管理
    description: 模型加载与配置
    x-displayName: 模型管理
  - name: 动画生成
    description: 多段运动生成
    x-displayName: 动画生成
  - name: 画布
    description: 画布元数据 CRUD，视口与背景管理
    x-displayName: 画布
  - name: 画布节点
    description: 画布上的 text/image/video/audio/config/group 节点管理
    x-displayName: 画布节点
  - name: 画布连线
    description: 节点之间的连线管理
    x-displayName: 画布连线
  - name: 画布媒体
    description: 画布节点的媒体文件（图片/视频/音频）上传、下载与元数据管理
    x-displayName: 画布媒体
  - name: 静态文件
    description: 缩略图、图片、动画等静态资源
    x-displayName: 静态文件
  - name: 子项目
    description: 子项目 CRUD、参与人员关联
    x-displayName: 子项目
  - name: AI实体类别
    description: AI 生成实体类别管理
    x-displayName: AI实体类别
  - name: AI生成实体
    description: AI 生成实体及预览、参考文件管理
    x-displayName: AI生成实体
  - name: 任务
    description: AI 生成任务提交、查询、取消、归档
    x-displayName: 任务
  - name: 限额管理
    description: Token 配额查询与设置
    x-displayName: 限额管理
  - name: AI生成剧集
    x-displayName: AI生成剧集
paths:
  /api/doodle/ai/animation/train/settings:
    post:
      tags:
        - 模型管理
      summary: 加载 Kimodo 模型
      description: >
        根据 model_path 加载 Kimodo 模型。`model_path` 可为目录（自动定位其中的
        `model_config.json`）或直接指向模型配置文件。

        加载成功后返回模型路径及骨骼信息，供生成接口使用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - model_path
              properties:
                model_path:
                  type: string
                  description: 模型目录或 model_config.json 文件路径
      responses:
        '200':
          description: 加载成功，返回模型路径与骨骼信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  model_path:
                    type: string
                    description: 模型路径
                  skeleton:
                    type: array
                    description: 骨骼关节列表
                    items:
                      $ref: '#/components/schemas/SkeletonJoint'
        '500':
          description: 模型加载失败（文件不存在、ONNX 初始化失败等）
      security:
        - bearerAuth: []
  /api/doodle/ai/animation/train:
    post:
      tags:
        - 动画生成
      summary: 生成动画
      description: |
        按顺序生成一个或多个运动段，段间自动创建平滑过渡。须先通过 `settings` 接口加载模型。

        请求体支持两种形式：
        - `segments`：运动段数组（多段生成）
        - `segment`：单个运动段对象（单段生成，内部转为单元素数组）

        可选传 `skeleton`（用于最终重定向，层级须与模型骨骼相同且处于原点）与 `root_trajectory`（根位置偏移）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  properties:
                    segments:
                      type: array
                      description: 运动段参数列表（与 segment 二选一）
                      items:
                        $ref: '#/components/schemas/GenerateSegmentArgs'
                    segment:
                      $ref: '#/components/schemas/GenerateSegmentArgs'
                      description: 单个运动段参数（与 segments 二选一）
                    skeleton:
                      type: array
                      description: 重定向用骨骼（选填）
                      items:
                        $ref: '#/components/schemas/SkeletonJoint'
                    root_trajectory:
                      type: array
                      minItems: 3
                      maxItems: 3
                      items:
                        type: number
                      description: 根位置偏移 [x, y, z]（选填）
                    first_heading_angle:
                      type: number
                      description: 首段朝向角（弧度，选填，默认 0）
                - anyOf:
                    - required:
                        - segments
                    - required:
                        - segment
      responses:
        '200':
          description: 生成成功，返回拼接后的完整运动输出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MotionOutput'
        '500':
          description: 模型未加载、约束无效或生成失败
      security:
        - bearerAuth: []
  /api/canvas:
    get:
      tags:
        - 画布
      summary: 获取画布列表
      description: 获取指定项目下的所有画布
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: 项目ID
      responses:
        '200':
          description: 画布列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InfiniteCanvas'
      security:
        - bearerAuth: []
    post:
      tags:
        - 画布
      summary: 创建画布
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - project_uuid_id
              properties:
                title:
                  type: string
                  description: 画布名称
                description:
                  type: string
                  description: 画布描述
                project_uuid_id:
                  type: string
                  format: uuid
                  description: 所属项目ID
                backgroundMode:
                  $ref: '#/components/schemas/CanvasBackgroundMode'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfiniteCanvas'
      security:
        - bearerAuth: []
  /api/canvas/{canvas_id}:
    get:
      tags:
        - 画布
      summary: 获取画布详情
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 画布详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfiniteCanvas'
      security:
        - bearerAuth: []
    put:
      tags:
        - 画布
      summary: 更新画布
      description: 可更新字段：title, description, viewport, backgroundMode
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                description:
                  type: string
                viewport:
                  $ref: '#/components/schemas/Viewport'
                backgroundMode:
                  $ref: '#/components/schemas/CanvasBackgroundMode'
      responses:
        '200':
          description: 更新后的画布信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InfiniteCanvas'
      security:
        - bearerAuth: []
    delete:
      tags:
        - 画布
      summary: 删除画布
      description: 删除画布及其下所有节点和连线
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 删除成功
      security:
        - bearerAuth: []
  /api/canvas/{canvas_id}/node:
    get:
      tags:
        - 画布节点
      summary: 获取画布节点列表
      description: 返回指定画布下的所有节点
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 节点列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CanvasNode'
      security:
        - bearerAuth: []
    post:
      tags:
        - 画布节点
      summary: 创建画布节点
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
              properties:
                type:
                  $ref: '#/components/schemas/CanvasNodeType'
                title:
                  type: string
                  description: 节点标题
                position:
                  $ref: '#/components/schemas/Position'
                width:
                  type: number
                  format: double
                  default: 340
                height:
                  type: number
                  format: double
                  default: 240
                content:
                  type: string
                  description: 节点内容（文本 或 媒体URL）
                metadata:
                  type: object
                  description: 扩展元数据（prompt, status, model, size, generationMode 等）
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanvasNode'
      security:
        - bearerAuth: []
  /api/canvas/{canvas_id}/node/{node_id}:
    get:
      tags:
        - 画布节点
      summary: 获取画布节点详情
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 节点详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanvasNode'
      security:
        - bearerAuth: []
    put:
      tags:
        - 画布节点
      summary: 更新画布节点
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  $ref: '#/components/schemas/CanvasNodeType'
                title:
                  type: string
                position:
                  $ref: '#/components/schemas/Position'
                width:
                  type: number
                  format: double
                height:
                  type: number
                  format: double
                content:
                  type: string
                metadata:
                  type: object
      responses:
        '200':
          description: 更新后的节点信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanvasNode'
      security:
        - bearerAuth: []
    delete:
      tags:
        - 画布节点
      summary: 删除画布节点
      description: 删除节点及其关联的所有连线
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 删除成功
      security:
        - bearerAuth: []
  /api/canvas/{canvas_id}/connection:
    get:
      tags:
        - 画布连线
      summary: 获取画布连线列表
      description: 返回指定画布下的所有节点间连线
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 连线列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CanvasConnection'
      security:
        - bearerAuth: []
    post:
      tags:
        - 画布连线
      summary: 创建画布连线
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - fromNodeId
                - toNodeId
              properties:
                fromNodeId:
                  type: string
                  format: uuid
                  description: 起始节点ID
                toNodeId:
                  type: string
                  format: uuid
                  description: 目标节点ID
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanvasConnection'
      security:
        - bearerAuth: []
  /api/canvas/{canvas_id}/connection/{connection_id}:
    delete:
      tags:
        - 画布连线
      summary: 删除画布连线
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: connection_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 删除成功
      security:
        - bearerAuth: []
  /api/canvas/{canvas_id}/node/{node_id}/media:
    get:
      tags:
        - 画布媒体
      summary: 获取节点媒体列表
      description: 返回指定节点的所有媒体文件元数据
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 媒体列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CanvasMedia'
      security:
        - bearerAuth: []
    post:
      tags:
        - 画布媒体
      summary: 上传媒体文件并创建媒体记录
      description: |
        上传媒体文件到节点。请求体使用 multipart/form-data。
        上传成功后自动创建 canvas_media 记录，并生成缩略图。
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 媒体文件
      responses:
        '200':
          description: 上传成功，返回媒体元数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanvasMedia'
      security:
        - bearerAuth: []
  /api/canvas/{canvas_id}/node/{node_id}/media/{media_id}:
    get:
      tags:
        - 画布媒体
      summary: 获取媒体详情
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: media_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 媒体详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanvasMedia'
      security:
        - bearerAuth: []
    put:
      tags:
        - 画布媒体
      summary: 更新媒体元数据
      description: 更新媒体属性（width, height, duration, original_name, metadata 等）
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: media_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                width:
                  type: integer
                  description: 宽度 px
                height:
                  type: integer
                  description: 高度 px
                duration:
                  type: number
                  format: double
                  description: 时长 秒
                original_name:
                  type: string
                  description: 原始文件名
                metadata:
                  type: object
                  description: 扩展元数据（codec, bitrate, framerate, mime_type 等）
      responses:
        '200':
          description: 更新后的媒体信息
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanvasMedia'
      security:
        - bearerAuth: []
    delete:
      tags:
        - 画布媒体
      summary: 删除媒体记录及文件
      description: 删除 canvas_media 记录及其所有版本的磁盘文件（原始 + 缩略图 + 预览）
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: media_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: 删除成功
      security:
        - bearerAuth: []
  /api/canvas/{canvas_id}/node/{node_id}/media/{media_id}/file/{role}:
    get:
      tags:
        - 画布媒体
      summary: 下载媒体文件
      description: |
        按 media_role 下载对应版本的文件。

        缩略图固定为 PNG 格式；原始文件按 file_extension 返回；预览按 preview_extension 返回。
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: media_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: role
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/MediaRole'
      responses:
        '200':
          description: 媒体文件二进制流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: 文件不存在
      security:
        - bearerAuth: []
    put:
      tags:
        - 画布媒体
      summary: 替换媒体文件
      description: |
        按 media_role 替换对应版本的文件（如单独上传缩略图或预览版本）。
        请求体使用 multipart/form-data。
      parameters:
        - name: canvas_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: node_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: media_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: role
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/MediaRole'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 媒体文件
      responses:
        '200':
          description: 替换成功，返回更新后的媒体元数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CanvasMedia'
      security:
        - bearerAuth: []
  /api/seedance2/thumbnail/{id}.png:
    get:
      tags:
        - 静态文件
      summary: 获取缩略图
      description: 根据预览文件 ID 获取缩略图（PNG 格式）
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 缩略图二进制数据
          content:
            image/png: {}
        '404':
          description: 缩略图不存在
      security:
        - bearerAuth: []
  /api/seedance2/pictures/{id}.png:
    get:
      tags:
        - 静态文件
      summary: 获取图片
      description: 根据预览文件 ID 获取原始图片/视频文件
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 图片/视频二进制数据
          content:
            image/png: {}
            video/mp4: {}
        '404':
          description: 文件不存在
      security:
        - bearerAuth: []
  /api/seedance2/animation/waiting.mp4:
    get:
      tags:
        - 静态文件
      summary: 获取等待动画
      description: 返回前端展示用的等待动画视频
      responses:
        '200':
          description: 等待动画视频
          content:
            video/mp4: {}
        '404':
          description: 文件不存在
      security:
        - bearerAuth: []
  /api/seedance2/subproject:
    get:
      tags:
        - 子项目
      summary: 获取子项目列表
      description: |
        获取当前用户可见的子项目列表。
        - 制片/管理员：查看所有子项目
        - 普通用户：仅查看自己参与的子项目
      responses:
        '200':
          description: 子项目列表
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Subproject'
      security:
        - bearerAuth: []
    post:
      tags:
        - 子项目
      summary: 创建子项目
      description: 制片及以上权限可创建子项目
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - project_id
              properties:
                name:
                  type: string
