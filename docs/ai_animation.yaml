openapi: "3.0.3"
info:
  title: AI 动画生成 API
  description: |
    AI 动画训练/生成模块 HTTP API，基于 Kimodo 运动生成模型，提供模型加载与多段运动生成能力。

    使用前须先调用 `settings` 接口加载模型，再调用 `train` 接口生成动画。

    所有接口均需 JWT Bearer Token 认证（Header: `Authorization: Bearer <token>`）。
  version: "1.0.0"
  contact:
    name: 索以动画研发中心

servers:
  - url: http://localhost:50025
    description: 本地开发服务器

tags:
  - name: 模型管理
    description: 模型加载与配置
  - name: 动画生成
    description: 多段运动生成

security:
  - bearerAuth: []

paths:
  /api/doodle/ai/animation/train/settings:
    post:
      tags: [模型管理]
      summary: 加载 Kimodo 模型
      description: |
        根据 model_path 加载 Kimodo 模型。`model_path` 可为目录（自动定位其中的 `model_config.json`）或直接指向模型配置文件。
        加载成功后返回模型路径及骨骼信息，供生成接口使用。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_path]
              properties:
                model_path:
                  type: string
                  description: 模型目录或 model_config.json 文件路径
      responses:
        "200":
          description: 加载成功，返回模型路径与骨骼信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  model_path:
                    type: string
                    description: 模型路径
                  skeleton:
                    type: array
                    description: 骨骼关节列表
                    items:
                      $ref: "#/components/schemas/SkeletonJoint"
        "500":
          description: 模型加载失败（文件不存在、ONNX 初始化失败等）

  /api/doodle/ai/animation/train:
    post:
      tags: [动画生成]
      summary: 生成动画
      description: |
        按顺序生成一个或多个运动段，段间自动创建平滑过渡。须先通过 `settings` 接口加载模型。

        请求体支持两种形式：
        - `segments`：运动段数组（多段生成）
        - `segment`：单个运动段对象（单段生成，内部转为单元素数组）

        可选传 `skeleton`（用于最终重定向，层级须与模型骨骼相同且处于原点）与 `root_trajectory`（根位置偏移）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  properties:
                    segments:
                      type: array
                      description: 运动段参数列表（与 segment 二选一）
                      items:
                        $ref: "#/components/schemas/GenerateSegmentArgs"
                    segment:
                      $ref: "#/components/schemas/GenerateSegmentArgs"
                      description: 单个运动段参数（与 segments 二选一）
                    skeleton:
                      type: array
                      description: 重定向用骨骼（选填）
                      items:
                        $ref: "#/components/schemas/SkeletonJoint"
                    root_trajectory:
                      type: array
                      minItems: 3
                      maxItems: 3
                      items:
                        type: number
                      description: 根位置偏移 [x, y, z]（选填）
                    first_heading_angle:
                      type: number
                      description: 首段朝向角（弧度，选填，默认 0）
                - anyOf:
                    - required: [segments]
                    - required: [segment]
      responses:
        "200":
          description: 生成成功，返回拼接后的完整运动输出
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MotionOutput"
        "500":
          description: 模型未加载、约束无效或生成失败

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token 认证

  schemas:
    SkeletonJoint:
      type: object
      required: [name, parent_idx, neutral_joint]
      properties:
        name:
          type: string
          description: 关节名称
        parent_idx:
          type: integer
          description: 父关节索引，根关节为 -1
        neutral_joint:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: number
          description: 中性姿态关节位置 [x, y, z]

    GenerateSegmentArgs:
      type: object
      required: [text]
      properties:
        text:
          type: string
          description: 该段的动作文本描述（必填）
        num_frames:
          type: integer
          default: 120
          description: 生成帧数
        num_denoising_steps:
          type: integer
          default: 50
          description: 去噪步数
        cfg_weight:
          type: array
          items:
            type: number
          default: [2.0, 2.0]
          description: 无分类器引导权重
        cfg_type:
          $ref: "#/components/schemas/CfgType"
        num_transition_frames:
          type: integer
          default: 10
          description: 与上一段之间的过渡帧数
        root_margin:
          type: number
          default: 0.0
          description: 根位置边距
        constraint_lst:
          type: array
          description: 约束列表（选填，每段不超过 20 个）
          items:
            $ref: "#/components/schemas/Constraint"

    CfgType:
      type: string
      enum: [nocfg, regular, separated]
      default: separated
      description: |
        nocfg - 无引导,
        regular - out_uncond + w*(out_cond - out_uncond),
        separated - 文本/约束分离引导

    Constraint:
      type: object
      required: [type, frame_indices]
      description: |
        运动约束。type 决定其余字段含义：
        - `root2d`：根轨迹约束，需 `smooth_root`，可选 `global_root_heading`
        - `fullbody`：全身约束，需 `local_joints_rot`、`root_positions`，可选 `smooth_root`
        - `end-effector` / `left-hand` / `right-hand` / `left-foot` / `right-foot`：末端执行器约束，需 `local_joints_rot`、`root_positions`，可选 `smooth_root`、`joint_names`
      properties:
        type:
          type: string
          enum: [root2d, fullbody, end-effector, left-hand, right-hand, left-foot, right-foot]
          description: 约束类型
        frame_indices:
          type: array
          items:
            type: integer
          description: 约束帧索引
        smooth_root:
          type: array
          items:
            type: array
            minItems: 3
            maxItems: 3
            items:
              type: number
          description: 平滑根位置序列（每帧 [x, y, z]）
        global_root_heading:
          type: array
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              type: number
          description: 全局根朝向序列（每帧 [cos, sin]，选填）
        local_joints_rot:
          type: array
          description: 局部关节旋转（轴角，可 [K, J, 3] 或 [K*J, 3] 扁平格式）
          items:
            type: array
            items:
              type: number
        root_positions:
          type: array
          items:
            type: array
            minItems: 3
            maxItems: 3
            items:
              type: number
          description: 根关节世界坐标序列（每帧 [x, y, z]）
        joint_names:
          type: array
          items:
            type: string
          description: 约束关节名称列表（end-effector 系列选填）

    MotionOutput:
      type: object
      description: Kimodo 运动解码输出，T 为帧数、J 为关节数
      properties:
        local_rot_mats:
          type: array
          description: 局部旋转矩阵 [T, J, 3, 3]
          items:
            type: array
            items:
              type: array
              items:
                type: number
        global_rot_mats:
          type: array
          description: 全局旋转矩阵 [T, J, 3, 3]
          items:
            type: array
            items:
              type: array
              items:
                type: number
        root_positions:
          type: array
          description: 根节点位置 [T, 3]
          items:
            type: array
            items:
              type: number
        smooth_root_pos:
          type: array
          description: 平滑根位置 [T, 3]
          items:
            type: array
            items:
              type: number
        global_root_heading:
          type: array
          description: 全局根朝向 [T, 2]，每帧 [cos, sin]
          items:
            type: array
            items:
              type: number
